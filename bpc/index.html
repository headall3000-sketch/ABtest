<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설문 만들기 2차 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#3182F6; --blue-d:#1B64DA; --blue-l:#E8F1FE; --blue-ll:#F3F8FF;
  --ink:#191F28; --ink2:#4E5968; --ink3:#8B95A1; --ink4:#B0B8C1;
  --line:#E5E8EB; --line2:#F2F4F6; --bg:#F7F8FA; --panel:#FFFFFF;
  --red:#F04452; --green:#22A06B; --ent:#2DB55D; --ent-bg:#E9F8EE;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* ---------- start / end ---------- */
.page{position:fixed;inset:0;overflow:auto;background:var(--bg);display:flex;justify-content:center;padding:56px 16px}
.sheet{width:640px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;padding:40px 44px;height:max-content}
.sheet h1{font-size:26px;font-weight:700;margin-bottom:6px}
.sheet .sub{color:var(--ink3);margin-bottom:28px}
.sheet h2{font-size:15px;font-weight:600;margin:24px 0 10px}
.sit{background:var(--blue-ll);border:1px solid var(--blue-l);border-radius:12px;padding:16px 18px;line-height:1.65}
.mlist{list-style:none;counter-reset:m;display:grid;gap:8px}
.mlist li{counter-increment:m;display:flex;gap:10px;line-height:1.5;color:var(--ink2)}
.mlist li::before{content:counter(m);flex:none;width:22px;height:22px;border-radius:50%;background:var(--line2);color:var(--ink2);font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:1px}
.q{margin-top:14px}
.q p{font-weight:500;margin-bottom:8px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--line);border-radius:10px;padding:9px 16px;color:var(--ink2)}
.opt.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d);font-weight:600}
.opts.col{flex-direction:column}
.opts.col .opt{display:flex;gap:10px;text-align:left;padding:9px 14px}
.opts.col .opt b{width:16px;flex:none}
.note{font-size:13px;color:var(--ink3);line-height:1.6;margin-top:22px}
.cta{margin-top:24px;width:100%;height:52px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;font-size:16px}
.cta:disabled{background:#C9D3DF;cursor:not-allowed}
.cta.sec{background:var(--line2);color:var(--ink2)}

/* ---------- editor shell ---------- */
#editor{position:fixed;inset:0;display:flex;flex-direction:column}
.topbar{height:56px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px 0 20px;position:relative;z-index:30}
.logo{color:var(--blue);display:flex}
.logo svg{width:30px;height:22px;fill:none;stroke:var(--blue);stroke-width:3.2;stroke-linecap:round}
.crumb{display:flex;align-items:center;gap:12px;margin-left:24px;color:var(--ink2)}
.crumb .sep{color:var(--ink4)}
.tabs{position:absolute;left:50%;transform:translateX(-50%);display:flex;background:var(--line2);border-radius:10px;padding:3px;gap:2px}
.tabs button{padding:6px 14px;border-radius:8px;color:var(--ink3)}
.tabs button.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px}
.ibtn{width:38px;height:38px;border-radius:10px;background:var(--line2);color:var(--ink2);display:grid;place-items:center;position:relative}
.ibtn:hover{background:#E8EBEE}
.pub{height:38px;padding:0 18px;border-radius:10px;background:var(--blue);color:#fff;font-weight:600}
.pub:hover{background:var(--blue-d)}
.avatar{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff 0 40%,#D9DEE4 41%);border:1px solid var(--line);margin-left:6px}

.body{flex:1;display:flex;gap:12px;padding:12px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0}
#left{width:230px;flex:none}
#right{width:268px;flex:none;overflow:auto}
#center{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}

.lsec{padding:14px 14px 8px 18px;display:flex;align-items:center;justify-content:space-between;color:var(--ink2);font-weight:500}
.plus{width:32px;height:32px;border-radius:9px;background:var(--line2);color:var(--ink2);display:grid;place-items:center}
.plus:hover{background:#E8EBEE}
.plus.focus{box-shadow:0 0 0 2px var(--blue) inset;background:#fff}
.flist{flex:1;overflow:auto;padding:4px 10px}
.fitem{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;cursor:pointer;position:relative;user-select:none}
.fitem:hover{background:var(--line2)}
.fitem.sel{background:var(--blue-l)}
.fitem.drag{opacity:.4}
.fitem.over-top{box-shadow:0 -2px 0 var(--blue)}
.fitem.over-bot{box-shadow:0 2px 0 var(--blue)}
.badge{display:flex;align-items:center;gap:4px;padding:3px 7px;border-radius:7px;font-size:13px;font-weight:600;flex:none}
.badge svg.i{width:14px;height:14px}
.ftitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.ftitle{line-height:20px}
.ftitle.noname{color:var(--ink3)}
.kebab{width:24px;height:24px;border-radius:6px;display:none;place-items:center;color:var(--ink3)}
.fitem:hover .kebab,.fitem.sel .kebab{display:grid}
.kebab:hover{background:rgba(0,0,0,.05)}
.ldiv{height:1px;background:var(--line);margin:0 8px;position:relative}
.ldiv::after{content:"";position:absolute;left:50%;top:-2px;width:30px;height:4px;margin-left:-15px;border-radius:2px;background:var(--line)}
.ending{height:34%;display:flex;flex-direction:column}

.menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:4px;z-index:60;min-width:200px}
.menu button{display:flex;width:100%;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;text-align:left}
.menu button:hover{background:var(--line2)}
.menu .danger{color:var(--red)}
.ent{font-size:12px;color:var(--ent);background:var(--ent-bg);border-radius:6px;padding:2px 7px;font-weight:500}

.ctool{display:flex;align-items:center;gap:8px;padding:12px 14px 0}
.chip{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;background:var(--line2);color:var(--ink2);font-weight:500}
.chip:hover{background:#E8EBEE}
.chip svg.i{width:16px;height:16px}
.live{margin-left:auto;font-size:12px;color:var(--ink2);background:var(--line2);border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:6px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ADE80}
.seg{display:flex;background:var(--line2);border-radius:10px;padding:3px}
.seg button{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:8px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);font-weight:500}
.seg svg.i{width:15px;height:15px}
.canvas{flex:1;overflow:auto;padding:24px 40px 160px;position:relative}

/* empty state (B) */
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-bottom:60px}
.empty img{width:150px;height:150px}
.empty b{font-size:17px;font-weight:600}
.empty span{color:var(--ink3)}

/* catalog */
.catalog{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 18px 22px}
.catalog.center{width:min(100%,880px);margin:28px auto 0}
.catalog.pop{position:fixed;z-index:68;width:620px;max-height:calc(100vh - 90px);overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.14)}
.cathead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.search{display:flex;align-items:center;gap:8px;width:250px;height:40px;border-radius:10px;background:var(--line2);padding:0 12px;color:var(--ink3)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.catseg{display:flex;background:var(--line2);border-radius:10px;padding:3px}
.catseg button{padding:6px 12px;border-radius:8px;color:var(--ink2);display:flex;gap:5px;align-items:center}
.catseg button.on{background:#fff;color:var(--ink)}
.cgrid{display:grid;gap:26px 14px}
.catalog.center .cgrid{grid-template-columns:repeat(4,1fr)}
.catalog.pop .cgrid{grid-template-columns:repeat(3,1fr)}
.cgroup h4{font-size:13px;font-weight:500;color:var(--ink3);margin:0 0 8px 8px}
.citem{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:10px;text-align:left;position:relative}
.citem:hover{background:var(--line2)}
.citem.dis{cursor:default}
.ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.ico svg.i{width:15px;height:15px}

/* field cards */
.fcard{position:relative;max-width:1000px;margin:0 auto 26px;padding:26px 30px 26px 34px;border-radius:14px;border:2px solid transparent;cursor:pointer}
.fcard.sel{border-color:var(--blue);background:#fff;cursor:default}
.fcard.sel::before{content:"";position:absolute;left:-2px;top:22%;bottom:22%;width:4px;background:var(--blue);border-radius:2px}
.glabel{position:absolute;top:-12px;left:30px;background:#fff;padding:0 10px;color:var(--blue);font-size:14px;font-weight:500;display:none;align-items:center;gap:4px}
.fcard.sel .glabel{display:flex}
.glabel svg.i{width:13px;height:13px}
.side{position:absolute;left:-52px;top:20px;display:none;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px}
.fcard.sel .side{display:flex}
.side button{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--ink3)}
.side button:hover{background:var(--line2)}
.side .del{color:var(--red)}
.req{color:var(--blue);font-size:12px;font-weight:500;margin-bottom:2px}
.qinput{width:100%;border:0;outline:0;background:none;font-size:22px;font-weight:600;color:var(--ink);padding:4px 0 14px}
.qinput::placeholder{color:#C3C9D0}
.box{background:#F8F9FA;border-radius:12px;color:var(--ink3);padding:14px 16px}
.datebox{display:inline-flex;gap:10px;align-items:center;color:var(--ink);padding:14px 18px}
.longbox{height:200px;position:relative}
.longbox svg{position:absolute;right:16px;bottom:14px}
.phonebox{display:flex;align-items:center;gap:12px;font-size:17px;color:#B9C0C8;position:relative}
.ccbtn{display:flex;align-items:center;gap:6px;color:var(--ink);padding:2px 4px;border-radius:6px}
.ccbtn:hover{background:#ECEEF0}
.ccbtn svg.i{width:16px;height:16px}
.ccbtn .ud{color:var(--ink3);width:14px;height:14px}
.ccpop{position:absolute;left:0;top:48px;width:360px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:8px;z-index:20;font-size:14px;color:var(--ink)}
.ccpop .row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer}
.ccpop .row:hover{background:var(--line2)}
.ccpop .row.on{background:var(--blue-l);color:var(--blue-d)}
.ccpop .row span:last-child{margin-left:auto;color:var(--ink3)}
.ccpop .list{max-height:260px;overflow:auto}
.photos{display:flex;gap:16px;flex-wrap:wrap}
.pcard{position:relative;width:290px;background:#F8F9FA;border-radius:14px;padding:8px}
.pdel{position:absolute;top:14px;right:14px;z-index:2;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.95);border:1px solid var(--line);color:var(--ink3);display:none;place-items:center}
.pdel svg.i{width:14px;height:14px}
.pcard:hover .pdel{display:grid}
.pdel:hover{color:var(--red)}
.pimg{height:260px;border:1px dashed #DDE1E5;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink3)}
.popt{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 6px;color:#B9C0C8}
.radio{width:22px;height:22px;border-radius:50%;border:5px solid #DADDE1;background:#fff;flex:none}
.hint{font-size:12.5px;color:var(--ink3);margin-top:6px}
.optrow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.optrow .box{flex:1;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.optrow .x{color:var(--ink3)}
.addopt{display:flex;align-items:center;gap:16px;margin-top:8px;color:var(--blue);font-weight:500}
.addopt button{display:flex;align-items:center;gap:6px;color:var(--blue)}
.addopt .more{margin-left:auto;color:var(--blue)}
.consent{color:var(--ink);line-height:1.75;font-size:15px}
.consent h3{font-size:22px;margin-bottom:12px}
.consent .tag{background:var(--blue-l);color:var(--blue-d);border-radius:4px;padding:1px 5px}
.consent table{border-collapse:collapse;margin:8px 0 16px 18px}
.consent td,.consent th{border:1px solid var(--line);padding:8px 16px;min-width:110px;height:36px}
.consent th{font-weight:600}
.consent .ask{font-size:19px;font-weight:600;margin:22px 0 14px}
.fcard.sel{padding-bottom:64px}
.addzone{position:absolute;left:0;right:0;bottom:0;height:60px;display:none}
.fcard.sel .addzone{display:block}
.addzone .ln{position:absolute;left:36px;right:36px;top:30px;border-top:2px solid #B9D3FB;opacity:0;transition:opacity .12s}
.addzone .btns{position:absolute;left:50%;top:13px;transform:translateX(-50%);display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .12s}
.addzone:hover .ln,.addzone:hover .btns{opacity:1;pointer-events:auto}
.addzone .btns button{display:flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:9px;background:var(--blue);color:#fff;font-weight:500;font-size:13.5px}
.submitwrap{max-width:1000px;margin:34px auto 0;padding:0 36px}
.submit{width:100%;height:56px;border-radius:12px;background:var(--blue);color:#fff;font-weight:500;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}

/* right panel */
.rp{padding:18px 18px 28px;position:relative}
.rp .close{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink3)}
.rp h5{font-size:14px;font-weight:600;margin:22px 0 10px;color:var(--ink)}
.rp h5:first-child{margin-top:4px}
.rinput{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;outline:none;background:#fff}
.rinput:focus{border-color:var(--blue)}
.rtype{display:flex;align-items:center;gap:10px;height:44px;border-radius:10px;background:#F8F9FA;padding:0 12px;color:var(--ink2)}
.rtype .chev{margin-left:auto;color:var(--ink3)}
.trow{display:flex;align-items:center;gap:6px;min-height:34px;color:var(--ink2)}
.trow .lab{flex:1;display:flex;align-items:center;gap:5px;white-space:nowrap;min-width:0}
.trow .ent{font-size:11px;padding:2px 6px}
.trow .lab svg.i{width:14px;height:14px;color:var(--ink3)}
.tog{width:40px;height:24px;border-radius:12px;background:#E1E5E9;position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:left .15s}
.tog.on{background:var(--blue)}
.tog.on::after{left:19px}
.tog.dis{opacity:.5;cursor:default}
.minmax{display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.minmax input{width:100%;min-width:0;height:40px;border:1px solid transparent;border-radius:9px;background:#F3F4F6;padding:0 10px;outline:none}
.minmax input:focus{border-color:var(--blue);background:#fff}
.rp-none{margin-top:56px;text-align:center;color:var(--ink3);font-style:italic}
.rp-empty{padding:30px 20px;color:var(--ink3);text-align:center;line-height:1.6}

/* tooltips & tips (B) */
.tt{position:fixed;z-index:80;background:#1F2937;color:#fff;font-size:12.5px;line-height:1.5;border-radius:9px;padding:8px 11px;max-width:260px;pointer-events:none}
.tt b{display:block;font-weight:600;margin-bottom:2px}
.tip{position:fixed;z-index:80;width:280px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.16);overflow:hidden;pointer-events:none}
.tip .ex img{display:block;width:100%;height:200px;object-fit:contain;background:#fff;border-bottom:1px solid var(--line2)}
.tip .ex{height:auto;display:block;overflow:hidden;background:#fff}
.tip .tx{position:relative;background:#fff;padding:12px 14px 14px;line-height:1.55;color:var(--ink2);font-size:13px}
.tip .tx b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}

/* coach marks (B) */
#coachDim{position:fixed;inset:0;z-index:90;pointer-events:auto}
#coachDim svg{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
#coachDim .hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(17,24,39,.48);pointer-events:none;transition:all .15s}
.coach{position:fixed;z-index:91;width:340px;background:var(--blue);color:#fff;border-radius:16px;padding:18px 18px 16px;box-shadow:0 14px 36px rgba(20,60,140,.35)}
.coach .cin{max-height:calc(100vh - 120px);overflow:auto;margin:-18px -18px -16px;padding:18px 18px 16px;border-radius:16px}
.coach::after{content:"";position:absolute;width:16px;height:16px;background:var(--blue);transform:rotate(45deg);border-radius:3px}
.coach.t-left::after{left:-7px;top:30px}
.coach.t-right::after{right:-7px;top:30px}
.coach.t-up::after{top:-7px;left:var(--tx,50%);margin-left:-8px}
.coach .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.coach .ch b{font-size:16px}
.coach .ch button{color:#fff;opacity:.85;width:26px;height:26px;display:grid;place-items:center;border-radius:7px}
.coach video.gif{display:block;width:100%;height:auto;aspect-ratio:720/390;object-fit:cover;background:#fff;margin-bottom:12px;border-radius:10px}
.coach .gif{height:120px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:12px;color:rgba(255,255,255,.75);margin-bottom:12px}
.coach ul{list-style:none;display:grid;gap:8px;margin-bottom:14px}
.coach li{line-height:1.5;font-size:13.5px}
.coach li b{display:block;font-size:14px}
.coach .cf{display:flex;align-items:center;justify-content:space-between}
.coach .cf span{font-size:12.5px;opacity:.8}
.coach .cf button{background:#fff;color:var(--blue-d);font-weight:600;border-radius:9px;padding:7px 16px}
.guideoff{position:fixed;left:24px;bottom:22px;z-index:40;height:40px;padding:0 16px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.08);color:var(--ink2);font-weight:500}

/* misc overlays */
.fab{position:fixed;right:22px;bottom:22px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#55B4FF,#2C7BF2);display:grid;place-items:center;z-index:40;box-shadow:0 4px 14px rgba(49,130,246,.35)}
.fab svg{width:26px;height:20px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round}
.modalbg{position:fixed;inset:0;background:rgba(17,24,39,.35);backdrop-filter:blur(3px);z-index:70;display:flex;align-items:center;justify-content:center}
.pvwrap{position:fixed;inset:0;z-index:70;background:rgba(17,24,39,.35);backdrop-filter:blur(4px)}
.pv{position:absolute;left:50%;transform:translateX(-50%);top:70px;bottom:90px;background:#fff;border-radius:16px;overflow:auto;border-top:4px solid var(--blue)}
.pv.desk{width:min(1260px,calc(100vw - 120px))}
.pv.mob{width:400px}
.pv .in{max-width:860px;margin:0 auto;padding:50px 30px 90px}
.pv .pq{margin-bottom:40px}
.pv .pq h4{font-size:19px;margin-bottom:12px}
.pvbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;border-radius:14px;padding:6px;display:flex;align-items:center;gap:4px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.pvbar button{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:9px;color:var(--ink2)}
.pvbar button.on{background:var(--blue-l);color:var(--blue-d);font-weight:500}
.pvbar .div{width:1px;height:24px;background:var(--line);margin:0 4px}
.made{position:sticky;bottom:12px;margin-left:30px;display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--ink2);gap:6px;align-items:center}
.dlg{background:#fff;border-radius:18px;padding:28px 28px 22px;width:420px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.dlg h3{font-size:19px;margin-bottom:8px}
.dlg p{color:var(--ink2);line-height:1.6}
.dlg .row{display:flex;gap:8px;margin-top:22px}
.dlg .row button{flex:1;height:46px;border-radius:11px;font-weight:600}
.dlg .pri{background:var(--blue);color:#fff}
.dlg .sec{background:var(--line2);color:var(--ink2)}
.settings{background:#fff;border-radius:18px;width:780px;height:560px;display:flex;flex-direction:column;padding:20px 24px}
.settings .sh{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:600;margin-bottom:16px}
.settings .sb{flex:1;display:flex;gap:20px}
.settings nav{width:120px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);padding-right:12px}
.settings nav button{text-align:left;padding:9px 12px;border-radius:9px;color:var(--ink2)}
.settings nav button.on{background:var(--blue-l);color:var(--blue-d);border:2px solid #9CC3FA}
.settings .sc{flex:1}
.stat{display:flex;align-items:center;justify-content:space-between;background:var(--line2);border-radius:12px;padding:14px 16px;font-weight:500;margin-bottom:22px}
.stat .bad{color:var(--red);background:#FDECEC;border-radius:8px;padding:4px 10px;font-size:13px}
.stat .good{color:var(--blue-d);background:var(--blue-l);border-radius:8px;padding:4px 10px;font-size:13px}
.sharepop{position:fixed;top:62px;width:440px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:18px;z-index:60}
.sharepop h6{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.sharepop .lk{display:flex;gap:8px;margin-bottom:14px}
.sharepop .lk div{flex:1;height:46px;border-radius:11px;background:var(--line2);display:flex;align-items:center;padding:0 12px;gap:8px;color:var(--ink);overflow:hidden;white-space:nowrap}
.sharepop .lk div span{flex:1;overflow:hidden;text-overflow:ellipsis}
.sharepop .lk button{width:46px;height:46px;border-radius:11px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center}
.toast{position:fixed;right:400px;bottom:28px;z-index:78;background:#fff;border:1px solid #CFEFD9;border-radius:14px;padding:16px 22px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:75;min-width:340px}
.toast i{width:24px;height:24px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff}
.toast i svg.i{width:14px;height:14px;stroke-width:3}

/* mission card (지금 미션 1개, 우측 하단, 최상단 레이어, A·B 동일) */
#mcard{position:fixed;right:20px;bottom:20px;width:360px;max-height:40vh;overflow:auto;background:#F3F5FB;border:1px solid #808080;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:200;padding:18px 20px 16px}
#mcard .mhd{display:flex;gap:10px;font-size:13.5px;color:var(--ink3);font-weight:500}
#mcard .mhd b{font-weight:500;color:var(--ink2)}
#mcard .mt{font-size:16px;font-weight:700;color:var(--ink);line-height:1.5;margin-top:8px;word-break:keep-all;overflow-wrap:anywhere}
#mcard .mlink{display:inline-block;margin-top:12px;font-size:13.5px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
#mcard .mch{font-size:13.5px;color:var(--ink3);margin:16px 0 8px}
#mcard .mc{display:flex;align-items:flex-start;gap:7px;font-size:13.5px;line-height:1.45;color:var(--ink2);margin-bottom:7px;word-break:keep-all}
#mcard .mc svg{flex:none;width:18px;height:18px;margin-top:1px}
#mcard .mc.ok{color:var(--blue-d)}
#mcard .mft{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
#mcard .mft .mlink{margin-top:0}
#mcard .mskip{margin-left:auto;background:#EEF0F3;color:var(--ink);font-weight:600;font-size:14px;border-radius:10px;padding:10px 16px}
#mcard .mskip:hover{background:#E4E7EB}
#mcard .alldone{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);font-size:16px}
#mcard .alldone i{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
#mcard .alldone i svg.i{width:13px;height:13px;stroke-width:3}
#mtoast{position:fixed;right:20px;width:360px;z-index:199;background:#EAF8EE;border:1px solid #8BD3A3;color:#1E7B45;border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(var(--hide,120px));transition:transform .35s ease,opacity .45s ease}
#mtoast.show{transform:translateY(0)}
#mtoast.fade{opacity:0}
#mcard .mload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink3);font-size:13.5px;padding:10px 0}
#mcard .spin{width:30px;height:30px;border-radius:50%;border:3px solid #DDE3EA;border-top-color:var(--blue);animation:mspin .8s linear infinite}
@keyframes mspin{to{transform:rotate(360deg)}}
#mtoast i{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
#mtoast i svg.i{width:13px;height:13px;stroke-width:3}
.coach li.hasic{display:flex;gap:10px}
.coach li.hasic svg.i{width:20px;height:20px;flex:none;margin-top:1px;stroke-width:1.8}
.coach.t-none::after{display:none}
#right .rp{padding-bottom:120px}
#narrow{position:fixed;inset:0;z-index:300;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:1.7}

/* ===== C안: 기능 찾기 검색 ===== */
@property --ca{syntax:'<angle>';inherits:false;initial-value:0deg}
#csearch{position:fixed;inset:0;z-index:300;background:rgba(17,24,39,.38);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;padding-top:64px}
.cs-bar{width:min(780px,calc(100vw - 64px));height:56px;background:#fff;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px 0 18px;box-shadow:0 14px 36px rgba(17,24,39,.18)}
.cs-bar svg.i{width:20px;height:20px;color:var(--ink3);flex:none}
.cs-bar input{flex:1;border:0;outline:0;font:inherit;font-size:17px;color:var(--ink);background:none;min-width:0}
.cs-bar input::placeholder{color:#A0A8B3}
.cs-bar kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--ink3);background:#fff;cursor:pointer}
.cs-res{width:min(780px,calc(100vw - 64px));margin-top:8px;background:#fff;border-radius:14px;max-height:calc(100vh - 170px);overflow:auto;padding:16px 16px 18px;box-shadow:0 14px 36px rgba(17,24,39,.18)}
.cs-h{font-size:13px;font-weight:600;color:var(--ink2);margin:2px 4px 12px}
.cs-empty{color:var(--ink2);margin:6px 4px 18px;line-height:1.6}
.cs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cs-card{text-align:left;display:flex;flex-direction:column;gap:6px;padding:8px 8px 10px;border-radius:12px;border:2px solid transparent;background:none;cursor:pointer;min-width:0}
.cs-card.on{border-color:var(--blue);background:var(--blue-ll)}
.cs-card .art{aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#F6F8FB}
.cs-card .art svg{display:block;width:100%;height:100%}
.cs-card b{font-size:16px;font-weight:700;color:var(--ink);margin-top:4px}
.cs-card b mark{background:none;color:var(--blue)}
.cs-card .cr{font-size:12.5px;color:var(--ink3);line-height:1.45}
.cs-foot{display:flex;gap:16px;font-size:12px;color:var(--ink3);margin:14px 4px 0;padding-top:10px;border-top:1px solid var(--line2)}

/* 강조: 위치 하이라이트 + 그라데이션 스트로크가 빙글빙글 */
#chl{position:fixed;inset:0;z-index:190;pointer-events:none}
#chl svg.dim{position:absolute;inset:0;width:100%;height:100%}
#chl .glow{position:absolute;inset:0;filter:blur(7px);opacity:.75}
#chl .ring{position:absolute;box-sizing:border-box;border-radius:12px;padding:3px;
  background:conic-gradient(from var(--ca),#007EFF,#5BC2FA,#62CBB5,#5BC2FA,#007EFF);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:cspin 1.6s linear infinite}
@keyframes cspin{to{--ca:360deg}}
#chl .note{position:absolute;max-width:300px;background:#1F2633;color:#fff;font-size:13px;line-height:1.55;border-radius:10px;padding:10px 12px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.cflash{animation:cflash 1.6s ease-in-out 1}
@keyframes cflash{0%,100%{background:transparent}25%,75%{background:#E3EEFF}50%{background:#F1F7FF}}

/* 설문 설정 창 */
.settings .sb{min-height:0}
.settings .sc{overflow:auto;padding:2px 8px 12px 2px}
.settings .srow{display:flex;align-items:center;min-height:40px;border-radius:10px;padding:0 10px;margin:0 -10px;color:var(--ink2)}
.settings .srow .lab{flex:1}
.settings .sinput{height:44px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--ink3);margin:4px 0 8px}
.settings .sinput svg.i{width:16px;height:16px}
.settings .sh5{margin:18px 0 6px;font-weight:600;font-size:14px}
.settings .shelp{font-size:12.5px;color:var(--ink3);margin:-2px 0 6px}
.settings .sbtn{height:40px;padding:0 14px;border-radius:10px;background:var(--line2);color:var(--ink2);font-weight:500}
.settings .scode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#F6F8FB;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink2);white-space:pre-wrap;margin:6px 0}


/* 하위 기능: 페이드인·아웃 깜빡임 */
#chl .blink{position:absolute;box-sizing:border-box;border-radius:9px;background:linear-gradient(90deg,rgba(0,126,255,.20),rgba(91,194,250,.20),rgba(98,203,181,.22));box-shadow:0 0 0 2px rgba(0,126,255,.6) inset;animation:cfade 1.1s ease-in-out infinite}
@keyframes cfade{0%,100%{opacity:0}50%{opacity:1}}
/* 호버해야 보이는 기능을 안내 중에는 드러냄 */
.addzone.creveal .ln,.addzone.creveal .btns{opacity:1}
.fitem.creveal .kebab{display:grid}
.settings nav{width:136px}
.settings nav button{white-space:nowrap}

/* Type C 단계 안내 툴팁 */
#chl .ctip{position:absolute;width:300px;pointer-events:auto;background:#fff;border-radius:14px;padding:14px 16px 12px;box-shadow:0 14px 36px rgba(17,24,39,.28);color:var(--ink)}
#chl .ctip-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#chl .ctip-n{font-size:12px;font-weight:600;color:#007EFF;background:#E8F1FE;border-radius:999px;padding:2px 8px}
#chl .ctip-h b{font-size:15px}
#chl .ctip-a{font-size:14px;line-height:1.55;font-weight:500}
#chl .ctip-d{font-size:13px;line-height:1.55;color:var(--ink2);margin-top:4px}
#chl .ctip-ex{font-size:13px;line-height:1.55;color:var(--ink2);background:#F3F8FF;border-radius:8px;padding:8px 10px;margin-top:8px}
#chl .ctip-ex span{display:block;font-size:11.5px;font-weight:600;color:#007EFF;margin-bottom:2px}
#chl .ctip-b{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
#chl .ctip-b button{height:32px;padding:0 12px;border-radius:8px;background:var(--line2);color:var(--ink2);font-weight:500;font-size:13px}
#chl .ctip-b button.end{background:#fff;border:1px solid var(--line)}

/* B안 툴팁·팁 미리보기는 강조 레이어 위로 */
.tip,.tt{z-index:260 !important}

/* IA v2.0: 상위(경로) 깜빡임 · 하위(기능) 테두리 회전 */

/* 설문 설정 창 IA 항목 */
.settings .schk{width:20px;height:20px;border-radius:6px;border:1.5px solid #B7C0CC;display:grid;place-items:center;margin-right:10px;flex:none;background:#fff}
.settings .schk.on{background:var(--blue);border-color:var(--blue);color:#fff}
.settings .schk svg.i{width:13px;height:13px;stroke-width:3}
.settings .sseg{display:inline-flex;gap:4px;background:var(--line2);border-radius:10px;padding:4px}
.settings .sseg button{height:34px;padding:0 14px;border-radius:8px;color:var(--ink2)}
.settings .sseg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.settings .sbtn.pri{background:var(--blue);color:#fff}
.settings .sfield{margin-bottom:14px}
.settings .sfield label{display:block;font-size:13.5px;color:var(--ink2);margin-bottom:4px}
.settings .srow .ent{font-size:11px;padding:2px 6px;margin-left:6px}

/* 상위(경로): 색 없이 명도만 — 어두운 막이 켜졌다 꺼졌다 */
#chl .blink{background:rgba(17,24,39,.42)!important;box-shadow:none!important;border-radius:10px;animation:cdim 1.2s ease-in-out infinite}
#chl .blink.soft{background:rgba(17,24,39,.32)!important}
@keyframes cdim{0%,100%{opacity:0}50%{opacity:1}}
/* 검색 모달: 검색 입력 영역 + 결과 카드 영역 */
.cs-go{height:36px;padding:0 16px;border-radius:9px;background:var(--blue);color:#fff;font-weight:600;font-size:14px;flex:none}
.cs-go:hover{background:var(--blue-d)}
.cs-res[hidden]{display:none}
/* 버튼 커스텀 · 브랜딩 팝오버 */
.cpop{position:fixed;z-index:62;width:340px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:16px 14px 14px}
.cpop.wide{width:392px}
.cpop h6{font-size:15px;font-weight:600;margin-bottom:12px}
.cp-row{display:flex;align-items:center;justify-content:space-between;min-height:38px;color:var(--ink2)}
.cp-lab{font-size:13.5px;color:var(--ink2);margin:6px 0 6px;display:flex;align-items:center;gap:4px}
.cp-lab svg.i{width:13px;height:13px;color:var(--ink3)}
.cp-in{width:100%;height:46px;border:0;border-radius:11px;background:var(--line2);padding:0 12px;font:inherit;color:var(--ink)}
.cp-in:focus{outline:2px solid var(--blue)}
.cp-help{font-size:12.5px;color:var(--ink3);line-height:1.5;margin-top:8px}
.cp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 10px;margin-bottom:6px}
.cp-color{height:46px;border-radius:11px;background:var(--line2);display:flex;align-items:center;padding:0 10px 0 12px;gap:8px}
.cp-color input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:14px;color:var(--ink)}
.cp-color:focus-within{outline:2px solid var(--blue);background:#fff}
.cp-color.auto span{flex:1;color:var(--ink3);font-size:14px}
.cp-color .sw{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);flex:none}
.cp-color .sw.dash{border:1.5px dashed #C9D0D8;background:none}
/* 5. 문항 카드 더보기(…) 비활성 */
.addopt .more{opacity:.35;cursor:not-allowed;pointer-events:none}

/* ===== + (문항 추가) 버튼 ===== */
/* 바깥 링·밝은 선 없이: 단색 배경 + 둥근 모서리만. 열린 상태 표시는 1px 테두리 하나 */
.plus{outline:none;border:0;box-shadow:none}
.plus::before,.plus::after{content:none}
.plus.focus{box-shadow:inset 0 0 0 1px var(--blue)}
.plus:focus{outline:none}
.plus:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(49,130,246,.45)}
.plus.focus:focus-visible{box-shadow:inset 0 0 0 1px var(--blue),0 0 0 2px rgba(49,130,246,.45)}
/* + 버튼 강조: 숨 쉬듯 천천히 밝아졌다 어두워짐 (한 바퀴 2.5초) */
/* 지나가는 위치(상위) 강조: 같은 모양의 구멍이 숨 쉬듯 밝아졌다 어두워짐 (한 바퀴 2.5초). 덧씌우는 막·테두리 없음 */
#chl .hpulse{animation:hpulse 1.25s ease-in-out infinite alternate}
#chl .hpulse.inv{animation-name:hpulseinv}
@keyframes hpulse{from{opacity:1}to{opacity:.4}}
@keyframes hpulseinv{from{opacity:0}to{opacity:.75}}
@media (prefers-reduced-motion: reduce){#chl .hpulse{animation:none;opacity:1}#chl .hpulse.inv{animation:none;opacity:.35}}
@media (prefers-reduced-motion: reduce){#chl .ring{animation:none}}
/* 미션 카드 접기·펴기 */
#mcard .mhd{align-items:center}
#mcard .mfold{order:9;margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none;outline:none}
#mcard .mfold:hover{background:rgba(0,0,0,.05)}
#mcard .mfold:focus-visible{box-shadow:0 0 0 2px rgba(49,130,246,.45)}
#mcard .mfold svg.i{width:18px;height:18px;transform:rotate(180deg);transition:transform .2s ease}
#mcard.folded .mfold svg.i{transform:none}
#mcard.folded{padding-top:12px;padding-bottom:12px}
#mcard.folded > :not(.mhd){display:none}
/* FAB + 메뉴 */
.cfab{right:22px;bottom:22px;z-index:205;border:0;outline:none}
.cfab:focus-visible{box-shadow:0 0 0 3px rgba(49,130,246,.45),0 4px 14px rgba(49,130,246,.35)}
.fabmenu{position:fixed;right:22px;bottom:86px;z-index:206;min-width:176px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:8px;display:flex;flex-direction:column}
.fabmenu button{text-align:left;height:40px;padding:0 12px;border-radius:10px;font-size:15px;color:var(--ink2);outline:none}
.fabmenu button:hover,.fabmenu button:focus-visible{background:var(--line2);color:var(--ink)}
.fabmenu button[data-fab="tutorial"]{color:var(--blue-d);font-weight:600}
.fabsep{height:1px;background:var(--line2);margin:4px 8px}
/* 미션 카드: FAB 왼쪽 16px, FAB와 아래쪽을 맞춤 (접힌 높이 = FAB 48px) */
#mcard{right:86px;bottom:22px}
#mcard.folded{padding:9px 12px 9px 18px;min-height:48px;box-sizing:border-box;display:flex;align-items:center}
#mcard.folded .mhd{flex:1}
#mtoast{right:86px}

/* 검색 결과: 영역별 소제목 */
.cs-grp{font-size:12.5px;font-weight:600;color:var(--ink3);margin:14px 4px 8px}
.cs-h + .cs-grp{margin-top:2px}

/* 결과 카드 영역: 바깥은 둥근 모서리 그대로, 안쪽만 스크롤 */
.cs-res{overflow:hidden!important;padding:0!important;display:flex;flex-direction:column}
.cs-scroll{overflow-y:auto;max-height:calc(100vh - 170px);padding:16px 16px 18px;scrollbar-width:thin;scrollbar-color:#CBD3DD transparent}
.cs-scroll::-webkit-scrollbar{width:10px}
.cs-scroll::-webkit-scrollbar-track{background:transparent;margin:12px 0}
.cs-scroll::-webkit-scrollbar-thumb{background:#CBD3DD;border-radius:10px;border:3px solid #fff}
/* 추천 검색어 드롭다운 */
.cs-bar{position:relative}
.cs-ac{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 36px rgba(17,24,39,.18);padding:6px;list-style:none;margin:0}
.cs-ac[hidden]{display:none}
.cs-ac li{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:9px;font-size:15px;color:var(--ink2);cursor:pointer}
.cs-ac li svg.i{width:16px;height:16px;color:var(--ink3);flex:none}
.cs-ac li b{font-weight:700;color:var(--ink)}
.cs-ac li.on{background:var(--blue-ll);color:var(--ink)}
.cs-ac li.none{color:var(--ink3);cursor:default}

/* 문항 유형 변경 드롭다운 */
.rtwrap{position:relative}
.rtype.can{cursor:pointer}
.rtype.can:hover{background:#F1F3F5}
.rtype.can:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(49,130,246,.45)}
.tmenu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.12);padding:6px;display:flex;flex-direction:column;gap:2px}
.tmenu button{display:flex;align-items:center;gap:12px;height:48px;padding:0 10px;border-radius:10px;font-size:15px;color:var(--ink);text-align:left;outline:none}
.tmenu button .ico{display:grid;place-items:center;border-radius:8px;flex:none}
.tmenu button .ico svg.i{width:16px;height:16px}
.tmenu button:hover,.tmenu button:focus-visible{background:var(--line2)}
.tmenu button.on{background:var(--blue-l);color:var(--blue-d);font-weight:600}
.tmenu button .nm{flex:1}
.tmenu button .ck{color:var(--blue);display:grid}
.tmenu button .ck svg.i{width:18px;height:18px;stroke-width:2.4}
/* 위치기록 */
.cmap{position:relative;height:300px;border-radius:12px;background:#F4F5F3;border:1px solid var(--line2);margin-top:4px}
.cmap-at{position:absolute;right:12px;bottom:10px;font-size:12.5px;color:#333;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.7);padding:2px 6px;border-radius:4px}
.cmap-at b{font-weight:500}
.cmap-at i{font-style:normal;width:16px;height:16px;border-radius:50%;background:#222;color:#fff;font-size:11px;display:grid;place-items:center;font-weight:700}
/* 촬영·위치 버튼 */
.cbtnrow{display:flex;justify-content:center;margin:18px 0 8px}
.cbtn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;font-size:15px}
.cbtn svg.i{width:18px;height:18px;stroke:#fff}
/* 파일 업로드 */
.cupload{margin-top:4px;border:1px dashed #E1E5E9;border-radius:14px;background:#FCFCFD;padding:28px 16px 30px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink2);font-size:14px}
.cupload svg.i{width:26px;height:26px;color:var(--ink);stroke-width:2}
.cupload b{font-size:15px;font-weight:500;color:var(--ink);margin-top:4px}
.cupload em{font-style:normal;color:var(--blue);font-weight:500;margin:6px 0}
.cupopt{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:14px;color:var(--ink2);font-size:14px}
.cmb{display:inline-flex;justify-content:space-between;align-items:center;width:136px;height:40px;border-radius:10px;background:var(--line2);padding:0 12px;color:#C3C9D0}
.cmb.on{color:var(--ink)}
/* 표 */
.ctable{display:flex;gap:12px;margin-top:6px}
.ctgrid{flex:1;display:grid;grid-template-columns:80px repeat(3,1fr);gap:10px 10px;align-items:center}
.ctgrid .th{text-align:center;color:var(--ink3);font-size:14px;padding:6px 0}
.ctgrid .rh{color:var(--ink3);font-size:14px;padding-left:16px}
.ctgrid .td{height:46px;border-radius:10px;background:var(--line2)}
.ctaddcol{width:46px;border:1px dashed #E1E5E9;border-radius:12px;display:grid;place-items:center;color:var(--ink3)}
.ctaddrow{margin:12px 58px 0 0;height:46px;border:1px dashed #E1E5E9;border-radius:12px;display:grid;place-items:center;color:var(--ink3)}
.ctaddcol svg.i,.ctaddrow svg.i{width:18px;height:18px}

/* 문항 설정 패널 ⓘ 툴팁 */
.itip{display:inline-grid;place-items:center;cursor:help;border-radius:50%;outline:none}
.itip svg.i{width:14px;height:14px;color:var(--ink3)}
.itip:focus-visible{box-shadow:0 0 0 2px rgba(49,130,246,.45)}
.rtip{position:fixed;z-index:270;max-width:360px;background:#2B2F36;color:#fff;font-size:13px;line-height:1.5;border-radius:8px;padding:9px 12px;pointer-events:none;word-break:keep-all;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.rtip.wide{max-width:none;width:350px;display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:12px 14px}
.rtip.wide p{margin:0}
.rtip.wide ul{margin:0;padding-left:14px;display:flex;flex-direction:column;gap:6px}
/* 긴 설정 이름 + Enterprise 배지가 ⓘ 아이콘을 가리지 않게: 이름은 줄바꿈 허용, 배지·토글은 고정 폭 */
#right .trow .lab{white-space:normal;word-break:keep-all;flex-wrap:wrap;row-gap:2px;column-gap:4px;line-height:1.35;min-width:0}
#right .trow .ent,#right .trow .tog{flex:none}
#right .trow .lab{display:block;flex:1 1 auto}
#right .trow .lab .itip,#right .trow .lab > svg.i{display:inline-grid;vertical-align:-2px;margin-left:4px}

/* 왼쪽 위 프로필 로고 */
.logo .clogo{width:32px;height:32px;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 1px var(--line)}
/* 문항 카드 본문 2 */
.optrow .box.ph{color:var(--ink3)}
.optrow .box .ock{width:22px;height:22px;color:#C9CED4;stroke-width:1.6;flex:none}
.crank{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:14px;color:var(--ink2);font-size:14px}
.cnum{display:inline-flex;align-items:center;justify-content:space-between;width:136px;height:40px;border-radius:10px;background:var(--line2);padding:0 12px 0 14px;color:var(--ink3)}
.cnum b{font-weight:500;color:var(--ink);margin-left:auto;margin-right:16px}
.csel{display:flex;justify-content:space-between;align-items:center;height:56px;border-radius:12px;background:#F8F9FA;padding:0 16px;color:var(--ink);font-size:16px}
.csel svg.i{width:20px;height:20px;color:var(--ink)}
.cscale{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.cdd{display:flex;align-items:center;gap:22px;height:46px;padding:0 14px;border-radius:10px;background:#F8F9FA;color:var(--ink);font-size:16px}
.cdd svg.i{width:16px;height:16px;color:var(--ink3)}
.cchips{display:flex;justify-content:center;gap:12px;margin:18px 0}
.cchips span{width:46px;height:46px;border-radius:10px;background:#F8F9FA;display:grid;place-items:center;color:var(--ink);font-size:16px}
.clab{width:220px;height:46px;border-radius:10px;background:#F8F9FA;display:flex;align-items:center;padding:0 12px;color:#B7BDC5}
.cmx{display:flex;gap:12px;margin-top:6px}
.cmx-main{flex:1;display:flex;flex-direction:column;gap:10px}
.cmx-h{display:grid;grid-template-columns:110px repeat(3,1fr);color:var(--ink3);font-size:14px;text-align:center;padding:6px 0}
.cmx-r{display:grid;grid-template-columns:110px 1fr;align-items:center}
.cmx-r .rh{color:var(--ink3);font-size:14px;padding-left:16px}
.cmx-r .band{display:grid;grid-template-columns:repeat(3,1fr);height:56px;align-items:center;justify-items:center;border-radius:12px;background:#F8F9FA}
.cmx-r .band .ock{width:28px;height:28px;color:#C3C8CE;stroke-width:1.5}
.cmx-r .band .radio{width:26px;height:26px}
.cmx .ctaddcol{width:46px;border:1px dashed #E1E5E9;border-radius:12px;display:grid;place-items:center;color:var(--ink3)}
.box.cin{display:flex;justify-content:space-between;align-items:center;min-height:56px;box-sizing:border-box;font-size:16px}
.box.cin svg.i{width:18px;height:18px;color:var(--ink3)}
.box.caddr{display:flex;align-items:center;gap:10px;min-height:56px;box-sizing:border-box;color:var(--ink);font-size:16px}
.box.caddr svg.i{width:18px;height:18px;color:var(--ink)}
.clink{display:inline-flex;align-items:center;gap:8px;color:var(--blue);font-weight:600;font-size:16px}
.clink svg.i{width:20px;height:20px;stroke:var(--blue)}
.cmx-r .band > span{display:grid;place-items:center}
.cmx-r .band .radio{width:28px;height:28px;min-width:28px;box-sizing:border-box;border-width:6px}

/* ---- 3.2: 미션 힌트 · 검색 유도 ---- */
#mcard .mhint{margin-top:10px;padding:10px 12px;background:#fff;border:1px solid #D6E4FF;border-radius:10px;font-size:13.5px;line-height:1.55;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
#mcard .mhint b{color:#007EFF;margin-right:6px}
#mcard .mhintbtn{display:flex;width:max-content;align-items:center;gap:4px;margin-top:10px;font-size:13.5px;color:#007EFF;font-weight:600}
#mcard .mhintgo{display:flex;width:max-content;align-items:center;gap:6px;margin-top:10px;background:#007EFF;color:#fff;font-weight:600;font-size:13.5px;border-radius:10px;padding:9px 14px}
#mcard .mhintgo svg.i{width:16px;height:16px}
#mcard.folded .mhint,#mcard.folded .mhintbtn,#mcard.folded .mhintgo{display:none}
body:has(#csearch) #mcard,body.cs-open #mcard,body.cs-open #mtoast{z-index:310!important;filter:none!important}
body:has(#coachDim) .ibtn.pulse{animation:none!important;box-shadow:none!important}
.ibtn.pulse{position:relative;animation:sbPulse 1.6s ease-out infinite;border-radius:10px}
@keyframes sbPulse{0%{box-shadow:0 0 0 0 rgba(0,126,255,.55)}70%{box-shadow:0 0 0 10px rgba(0,126,255,0)}100%{box-shadow:0 0 0 0 rgba(0,126,255,0)}}
@media (prefers-reduced-motion:reduce){.ibtn.pulse{animation:none;box-shadow:0 0 0 3px rgba(0,126,255,.5)}}
.cs-tip{width:min(780px,calc(100vw - 64px));margin:10px 0 0;padding:10px 14px;background:#EEF5FF;color:#1F2633;border-radius:10px;font-size:13.5px;line-height:1.5;display:flex;gap:8px;align-items:center;box-shadow:0 8px 20px rgba(17,24,39,.12)}
.cs-tip svg.i{width:16px;height:16px;flex:none;color:#007EFF}
.settings input.sinput{width:100%;color:var(--ink);font:inherit;font-size:14px;outline:none;background:#fff}
.settings input.sinput:focus{border-color:#007EFF;box-shadow:0 0 0 3px rgba(0,126,255,.15)}

/* 2차 UT 피드백: 시작 화면 미션 카드 위치 안내 · 예시 화면 배지 */
.mcpreview{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.mcpreview p{font-size:12.5px;color:var(--ink3)}
.mcp-screen{position:relative;width:100%;max-width:420px;height:150px;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.mcp-screen>span{position:absolute;top:22px;bottom:10px;background:#fff;border:1px solid var(--line);border-radius:6px}
.mcp-screen>span:nth-child(1){left:10px;width:18%}
.mcp-screen>span:nth-child(2){left:calc(18% + 18px);right:calc(20% + 18px)}
.mcp-screen>span:nth-child(3){right:10px;width:20%}
.mcp-screen::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:#fff;border-bottom:1px solid var(--line)}
.mcp-card{position:absolute;right:14px;bottom:14px;width:120px;padding:8px 10px;border-radius:8px;background:#F3F5FB;border:1.5px solid var(--blue);box-shadow:0 4px 12px rgba(49,130,246,.25);display:flex;flex-direction:column;gap:4px}
.mcp-card b{font-size:10.5px;color:var(--blue-d)}
.mcp-card i{display:block;height:5px;border-radius:3px;background:#C9D3DF}
.mcp-card i+i{width:60%}
.demo-badge{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;width:max-content;max-width:100%;margin:0 auto 14px;padding:7px 14px;border-radius:999px;background:var(--blue-l);color:var(--blue-d);font-size:13px;font-weight:600}
.demo-badge svg.i{width:15px;height:15px}

const ARM_OK = a => a==="Bp"||a==="C";

function applyArm(){
  if(ARM!=="C"||COACH.top.items.some(x=>x[0]==="기능 찾기")) return;
  COACH.top.items.push(["기능 찾기","찾는 기능을 입력하면 그 기능이 있는 곳을 순서대로 알려 줘요. / 키로도 열 수 있어요.","search"]);
}
async function assignArm(){
  if(!ARM_OK(ARM)){
    if(CONFIG.ASSIGN_URL){
      try{
        const ac=new AbortController(); const to=setTimeout(()=>ac.abort(),4000);
        const u=CONFIG.ASSIGN_URL+"?action=assign&exp=bpc&pid="+encodeURIComponent(PID)+"&stratum="+stratum()+"&prof="+S.prof+"&form_exp="+encodeURIComponent(S.formExp||"")+(IS_INTERNAL?"&internal=1":"");
        const r=await fetch(u,{signal:ac.signal}); clearTimeout(to); const j=await r.json();
        if(j && ARM_OK(j.variant)){ ARM=j.variant; ARM_METHOD="balanced"; }
      }catch(e){}
    }
    if(!ARM_OK(ARM)){ ARM=Math.random()<0.5?"Bp":"C"; ARM_METHOD=CONFIG.ASSIGN_URL?"random_fallback":"random"; }
  }
  store.set("walla_bpc_arm_"+PID, ARM); setUrl(); applyArm();
}
function setUrl(){ try{ const u=new URL(location.href); u.searchParams.set("pid",PID); u.searchParams.delete("v"); if(ARM_OK(ARM)) u.searchParams.set("arm",ARM); history.replaceState(null,"",u.toString()); }catch(e){} }

  }
  if(!VARIANT){ VARIANT=Math.random()<0.5?"A":"B"; ASSIGN_METHOD=CONFIG.ASSIGN_URL?"random_fallback":"random"; }

}

function track(type, props={}){
  const ev = {event_type:type, user_id:PID, device_id:DEVICE, time:now(), insert_id:PID+"-"+now()+"-"+Math.random().toString(36).slice(2,7),
    event_properties:Object.assign({variant:ARM_LABEL(), ut_round:"2nd_BpC", current_mission:curMission(), elapsed_ms:S.t0?now()-S.t0:0, coach_mark_active:!!S.coach, viewport_w:innerWidth, is_internal:IS_INTERNAL, resumed:S.resumed}, props)};

  ev._sent=false; queue.push(ev); store.set(LOGKEY,queue); saveState();
  if(IS_INTERNAL||qs.get("debug")==="1") console.log("[UT]",type,ev.event_properties);
  send([ev]);
}
function send(evs){
  if(!CONFIG.AMPLITUDE_API_KEY || !evs.length) return Promise.resolve();
  const body = JSON.stringify({api_key:CONFIG.AMPLITUDE_API_KEY, events:evs.map(({_sent,...e})=>e)});
  return fetch(CONFIG.AMPLITUDE_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body,keepalive:body.length<60000})
    .then(r=>{ if(r.ok){ evs.forEach(e=>e._sent=true); store.set(LOGKEY,queue);} }).catch(()=>{});
}
function flush(){ return send(queue.filter(e=>!e._sent)); }

/* 코치마크가 떠 있던 시간 중 [a,b] 구간과 겹치는 부분 */
function coachOverlap(a,b){
  let t=0; const spans=S.coachLog.slice(); if(S.coachStart) spans.push([S.coachStart, now()]);
  spans.forEach(([s,e])=>{ const lo=Math.max(a,s), hi=Math.min(b,e); if(hi>lo) t+=hi-lo; });
  return t;
}
/* 페이지를 떠나 있던 시간(새로고침·창 닫기 후 재접속) 중 [a,b]와 겹치는 부분 */
function gapOverlap(a,b){ let t=0; S.gaps.forEach(([s,e])=>{ const lo=Math.max(a,s), hi=Math.min(b,e); if(hi>lo) t+=hi-lo; }); return t; }
function gapTotal(){ return S.gaps.reduce((x,[a,b])=>x+(b-a),0); }
function seg(a,b){ return (a&&b&&b>=a) ? (b-a)-coachOverlap(a,b)-gapOverlap(a,b) : null; }
function coachTotal(){ return S.coachLog.reduce((s,[a,b])=>s+(b-a),0); }

/* ---------- 미션 판정 ---------- */
function longMin50(f){ return f.type==="long" && f.len.on && Number(f.len.min)===50; }
/* 미션 6: 마지막 문항이 전화번호이고, 실제로 아래로 옮겼음
   (그 문항보다 나중에 만든 문항이 위에 있거나, 미션 6 시작 시점엔 맨 아래가 아니었음) */
const fnum = f => +f.id.slice(1);
function m6ok(F){
  if(F.length<2) return false;
  const last=F[F.length-1];
  if(last.type!=="phone") return false;
  if(F.some(f=>fnum(f)>fnum(last))) return true;
  return !!(S.m6Base && S.m6Base.length && S.m6Base[S.m6Base.length-1]!==last.id);
}
/* 미션 6 '다른 문항 순서 유지': 미션 6이 시작될 때의 순서(없으면 만든 순서)와 나머지 문항의 상대 순서가 같음 */
function othersKept(F){
  const last=F[F.length-1];
  const others=F.filter(f=>!(f===last&&f.type==="phone")).map(f=>f.id);
  const base=(S.m6Base||F.slice().sort((a,b)=>fnum(a)-fnum(b)).map(f=>f.id)).filter(id=>others.includes(id));
  const o=others.filter(id=>base.includes(id));
  return o.length===base.length && o.every((id,k)=>id===base[k]);
}
function check(){
  const F=S.fields, has=t=>F.some(f=>f.type===t);
  const cond = [
    has("date"), /* 2차 UT: 두 안 공통 — 날짜 문항만 있으면 성공 */
    F.some(longMin50),
    !!(S.settingsSeen && S.sset && S.sset.limit && Number(S.sset.limitN)===20),
    !!(S.btnPopSeen && btnTextOk()),
    has("phone"),
    F.some(f=>f.type==="consent" && f.required),
    m6ok(F) && othersKept(F),
    S.previewOpened && S.previewClosed && S.published
  ];
  cond.forEach((ok,i)=>{
    if(ok && !S.done[i] && !S.gaveUp[i]){
      const t=now(); S.done[i]=t;
      const prev = i===0 ? S.t0 : (S.lastMissionDoneT||S.t0);
      const dur = t-prev-gapOverlap(prev,t);
      track("Mission Completed",{mission_no:i+1, duration_ms:dur, duration_excl_tutorial_ms:dur-coachOverlap(prev,t), first_click_correct:S.firstClickCorrect[i], max_hint_level:S.hint[i]||0});
      S.lastMissionDoneT=t;
      if(i===3) S.m3DoneT=t; // 연락처 미션(5) 직전 미션 완료 시점 → 구간 3 시작
      if(i===6) S.m6DoneT=t; // 순서 변경 미션(7) 완료 시점 → 구간 4 시작
    }
  });
  const c=curMission(); if(c<=8 && !S.missionStartT[c-1]) S.missionStartT[c-1]=now();
  if(c===7 && !S.m6Base) S.m6Base=S.fields.map(f=>f.id);
  syncCard();
}

function rightHTML(f){

  const choiceLike=["choice","multi","dropdown","dropdown_m","consent","photo","rank"].includes(f.type);
  let v=tog("required","필수입력",f.required);

   <button class="close" data-el="right_close">${ic("x")}</button>

const NON_TARGET = new Set(["submit_button","tab_1","tab_2","tab_3","button_custom","branding","live_edit","mode_logic","settings_button","share_button","walla_fab","empty_state","ending_plus","menu_template","toggle_enterprise","page_split","logo","crumb_team","crumb_project","avatar","share_open","catalog_custom","field_type_select","card_settings","settings_tab","toggle_include","toggle_exclude","toggle_regex","toggle_cinclude","toggle_cexclude","toggle_perlimit","toggle_shuffle","photo_add_image","add_other","field_more"]);
function areaOf(el){
  const a=el.closest("[data-area]"); let area=a?a.dataset.area:"other";
  const id=el.closest("[data-el]")?.dataset.el;
  if(["settings_button","preview_button","share_button"].includes(id)) area="icon";
  if(id==="field_more") area="more_menu";
  return area;
}
function firstClickRule(m, area, id){
  if(id==="search_button"||id==="search_key") return true; // 기능 찾기로 시작하면 모든 미션에서 올바른 첫 클릭
  if(m===1) return area==="left"||area==="center_catalog";
  if(m===2||(m>=5&&m<=7)) return area==="left";
  if(m===3) return id==="settings_button";
  if(m===4) return id==="button_custom";
  if(m===8) return id==="preview_button";
  return null;
}
function logClick(target){
  const elNode=target.closest("[data-el]"); if(!elNode) return;
  const id=elNode.dataset.el, area=areaOf(elNode);
  if(id==="canvas_blank" && target.closest(".fcard,.catalog,.submit,.empty")) return;
  if(area==="mission_card"){ track("UI Clicked",{area:"mission_card", element_id:id, is_target_area:null}); return; }
  const isTarget = !NON_TARGET.has(id);
  const m=curMission();
  if(m<=8 && !S.firstClickChecked[m-1] && S.screen==="editor" && !S.coach && !["coach_confirm","coach_close"].includes(id)){
    S.firstClickChecked[m-1]=true; S.firstClickCorrect[m-1]=!!firstClickRule(m,area,id);
  }
  const props={area, element_id:id, is_target_area:isTarget};
  if(elNode.dataset.type) props.field_type=elNode.dataset.type;
  track("UI Clicked",props);
  // 구간 끝점
  const t=now();
  if(S.firstAddT && !S.firstAddPlusT && (id==="left_plus"||id==="inline_add") && t>S.firstAddT+50) S.firstAddPlusT=t;
  if(S.longAddT && !S.lenToggleT && id==="toggle_length") S.lenToggleT=t;
  if(S.m6DoneT && !S.previewClickT && id==="preview_button") S.previewClickT=t;
}

/* 3.2: 코치마크는 '테스트 시작하기' 직후 한 번에 이어서 보여 줌 → 작업 중 흩어져 뜨는 트리거는 끔 */
function coachTrigger(area){ return false; }
function startTour(trigger){
  if(!(VARIANT==="B"||VARIANT==="C")||S.coachOff) return;
  const order=COACH_ORDER.filter(a=>!S.coachSeen[a]); if(!order.length) return;
  track("Tutorial Started",{trigger, areas:order.join(",")});
  const step=i=>{ if(i>=order.length){ S.coachOff=true; S.tourDone=true; track("Tutorial Finished",{completed:true}); render(); return; }
    S._trigger=trigger; S.pending=()=>step(i+1); showCoach(order[i]); };
  step(0);
}
function showCoach(area){
  S.coachSeen[area]=true; S.coach=area; S.coachStart=now(); S.coachPage=0;
  track("Coach Mark Shown",{area, trigger_element:S._trigger||""});
  renderCoach();
}
function closeCoach(method){
  const a=S.coach; if(!a) return; const d=now()-S.coachStart;
  S.coachLog.push([S.coachStart,now()]); S.coachStart=null; S.coach=null;
  const pg=COACH[a].pages; track("Coach Mark Closed",{area:a, method, duration_ms:d, pages_viewed:(S.coachPage||0)+1, pages_total:pg?pg.length:1});
  if(COACH[a].last) S.coachOff=true;
  let p=S.pending; S.pending=null;
  if(method==="close" && !S.tourDone && S._trigger!=="tutorial_replay"){ p=null; const rest=COACH_ORDER.filter(k=>!S.coachSeen[k]); rest.forEach(k=>S.coachSeen[k]=true); S.coachOff=true; S.tourDone=true; track("Tutorial Finished",{completed:false, skipped_at:a, skipped_areas:rest.join(",")}); }
  render();
  if(p) p();
}
function renderCoach(){
  document.getElementById("coachDim")?.remove(); document.querySelectorAll(".coach").forEach(n=>n.remove());
  if(!S.coach) return;
  const a=S.coach, cfg=COACH[a];
  let target, cls, x;
  const L=document.getElementById("left")?.getBoundingClientRect(), Ce=document.getElementById("center")?.getBoundingClientRect(),
        R=document.getElementById("right")?.getBoundingClientRect(), T=document.querySelector(".topbar .tright")?.getBoundingClientRect();
  const W=340;
  if(a==="left"){ target=L; cls="t-left"; x=L.right+16; }
  if(a==="center"){ target=Ce; cls="t-none"; x=Ce.left+4; }
  if(a==="right"){ target=R||{left:innerWidth-280,right:innerWidth-12,top:68,bottom:innerHeight-12,width:268,height:innerHeight-80}; cls="t-right"; x=target.left-W-16; }
  if(a==="top"){ target={left:T.left-6,top:8,right:T.right+6,bottom:50,width:T.width+12,height:42}; cls="t-up"; x=innerWidth-W-16; }
  const y = a==="top" ? 56+16 : COACH_Y; // 상단 코치마크: 화면 우측 끝·상단 네비게이션 바에서 각각 16px
  /* 하이라이트 구멍: 기본은 대상 하나. 중앙은 '버튼 커스텀·브랜딩'과 '설문 문항 카드'를 따로 뚫음 */
  const pad=(r,p)=>({left:r.left-p,top:r.top-p,right:r.right+p,bottom:r.bottom+p});
  let holes=[pad(target,4)];
  if(a==="center"){
    const b1=document.querySelector('[data-el="button_custom"]')?.getBoundingClientRect(), b2=document.querySelector('[data-el="branding"]')?.getBoundingClientRect();
    const card=(document.querySelector('.fcard.sel')||document.querySelector('.fcard'))?.getBoundingClientRect();
    holes=[];
    if(b1&&b2) holes.push(pad({left:b1.left,top:Math.min(b1.top,b2.top),right:b2.right,bottom:Math.max(b1.bottom,b2.bottom)},8));
    if(card){ const h=pad(card,6); h.top=Math.max(h.top,Ce.top+56); h.bottom=Math.min(h.bottom,Ce.bottom-4); holes.push(h); }
    if(!holes.length) holes=[pad(target,4)];
  }
  const rr=(h,r=14)=>{const w=h.right-h.left,ht=h.bottom-h.top; r=Math.min(r,w/2,ht/2);
    return `M${h.left+r},${h.top}H${h.right-r}A${r},${r} 0 0 1 ${h.right},${h.top+r}V${h.bottom-r}A${r},${r} 0 0 1 ${h.right-r},${h.bottom}H${h.left+r}A${r},${r} 0 0 1 ${h.left},${h.bottom-r}V${h.top+r}A${r},${r} 0 0 1 ${h.left+r},${h.top}Z`;};
  const dim=document.createElement("div"); dim.id="coachDim";
  dim.innerHTML=`<svg viewBox="0 0 ${innerWidth} ${innerHeight}" preserveAspectRatio="none"><path fill="rgba(17,24,39,.48)" fill-rule="evenodd" d="M0,0H${innerWidth}V${innerHeight}H0Z ${holes.map(h=>rr(h)).join(" ")}"/></svg>`;
  document.body.appendChild(dim);
  const c=document.createElement("div"); c.className="coach "+cls; c.style.left=x+"px"; c.style.top=y+"px";
  if(a==="top"){ const pb=document.querySelector('[data-el="preview_button"]').getBoundingClientRect(); c.style.setProperty("--tx",(pb.left+pb.width/2-x)+"px"); }
  const n=COACH_ORDER.filter(k=>S.coachSeen[k]).length;
  c.innerHTML=`<div class="cin"><div class="ch"><b>${cfg.title}</b><button data-c="close" aria-label="닫기">${ic("x")}</button></div>
   <video class="gif" src="${ASSET["coach_"+a]}" autoplay muted loop playsinline preload="auto"></video>
   <div class="cbody"></div></div>`;
  document.body.appendChild(c);
  c.querySelector('[data-c="close"]').onclick=()=>closeCoach("close");
  /* 페이지가 나뉜 코치마크: 영상은 그대로 두고 설명과 버튼만 바꿈 */
  const pages = cfg.pages || [cfg.items.map((_,i)=>i)];
  const paint=()=>{
    const pi=Math.min(S.coachPage||0, pages.length-1), lastPage=pi===pages.length-1;
    c.querySelector(".cbody").innerHTML=`<ul>${pages[pi].map(k=>{const [h,d,icn]=cfg.items[k]; return icn?`<li class="hasic">${ic(icn)}<div><b>${h}</b>${d}</div></li>`:`<li><b>${h}</b>${d}</li>`;}).join("")}</ul>
     <div class="cf"><span>${COACH_ORDER.indexOf(a)+1} / ${COACH_ORDER.length}</span><button data-c="confirm">${(lastPage&&cfg.last)?"확인":"다음"}</button></div>`;
    c.querySelector('[data-c="confirm"]').onclick=()=>{ if(lastPage) closeCoach("confirm"); else { S.coachPage=pi+1; paint(); } };
    avoidCard();
  };
  /* 화면이 낮아 미션 카드(최상단 레이어)와 겹치면, 같은 높이를 유지한 채 카드 왼쪽으로 옮기고 꼬리는 숨김 */
  const avoidCard=()=>{
    c.style.left=x+"px"; c.style.top=y+"px"; c.className="coach "+cls;
    const m=document.getElementById("mcard"); if(!m) return;
    const hit=()=>{ const cr=c.getBoundingClientRect(), mr=m.getBoundingClientRect(); return !(cr.bottom<=mr.top-8||cr.top>=mr.bottom||cr.right<=mr.left-8||cr.left>=mr.right); };
    if(!hit()) return;
    /* 1순위: 같은 x(대상 옆 16px)를 지키고 위로 올림 */
    const mr=m.getBoundingClientRect(), h=c.getBoundingClientRect().height;
    const ny=Math.max(56+16, mr.top-16-h); c.style.top=ny+"px";
    if(!hit()) return;
    /* 2순위: 원래 높이로 돌아가 카드 왼쪽으로 옮기고 꼬리 숨김 */
    c.style.top=y+"px"; c.style.left=Math.max(12, mr.left-W-16)+"px"; c.className="coach t-none";
  };
  paint();
}

function openPreview(){
  S.preview=true; S.previewOpened=true; S._pvT=now(); S.pop=null;
  track("Preview Opened",{}); render();
}
function publish(){
  S.published=true; /* C: 게시만으로 모든 미션 완료 처리하지 않음 — 미션 8개를 다 끝내야 완료 */ S.publishCount++; S.lastPublishT=now(); S.pop={kind:"share"}; S.toast=true;
  check();
  const t=S.lastPublishT;
  const segs=[seg(S.firstAddT,S.firstAddPlusT), seg(S.longAddT,S.lenToggleT), seg(S.m3DoneT,S.phoneAddT), seg(S.m6DoneT,S.previewClickT)];
  const find = segs.every(v=>v!==null) ? segs.reduce((a,b)=>a+b,0) : null;
  const ct=coachTotal();
  const gt=gapTotal();
  track("Survey Published",{publish_count:S.publishCount, session_ms:t-S.t0-gt, session_excl_coach_ms:t-S.t0-gt-ct, gap_total_ms:gt, resume_count:S.gaps.length, find_time_excl_coach_ms:find,
    find_seg1_ms:segs[0], find_seg2_ms:segs[1], find_seg3_ms:segs[2], find_seg4_ms:segs[3], coach_time_total_ms:ct, missions_done:S.done.filter(Boolean).length, ...profileProps()});
  render();
  setTimeout(()=>{ S.toast=false; if(S.screen==="editor"){ S.endAsk=true; render(); } },2000);
}
function finish(){ flush(); S.screen="end"; S.endAsk=false; saveState(); render(); }

const STKEY="walla_bpc_state_"+PID;
const PERSIST=["screen","prof","formExp","fields","sel","uid","published","allDone","card","done","gaveUp","coachSeen","coachOff","coach","coachStart","t0","coachLog",
 "firstAddT","firstAddPlusT","longAddT","lenToggleT","m3DoneT","phoneAddT","m6DoneT","previewClickT","previewOpened","previewClosed","publishCount","lastPublishT",
 "missionStartT","firstClickChecked","firstClickCorrect","lastMissionDoneT","m6Base","gaps","resumed","pvMode","_deletedPhoneInM6",
 "sset","brand","tourDone","searchUsed","searchPickedDate","settingsSeen","btnPopSeen","csTipShown","hint","hintT"];
function saveState(){
  if(!["editor","end"].includes(S.screen)) return;
  const o={}; PERSIST.forEach(k=>o[k]=S[k]); o.lastActiveT=now(); store.set(STKEY,o);
}
function resumeIfAny(){
  const sv=store.get(STKEY); if(!sv||!sv.screen) return;
  if(sv.screen==="end"){ S.screen="done"; return; }
  /* 게시했더라도 남은 미션이 있으면 편집 화면으로 이어서 진행 */
  if(sv.published){ const d=sv.done||[], g=sv.gaveUp||[]; let left=0; for(let i=0;i<8;i++) if(!d[i]&&!g[i]) left++; if(!left){ S.screen="done"; return; } }
  if(sv.screen!=="editor") return;
  const leave=sv.lastActiveT||now(), back=now();
  PERSIST.forEach(k=>{ if(k in sv) S[k]=sv[k]; });
  if(S.coach){ const a=S.coach; S.coachLog.push([S.coachStart||leave, leave]); S.coachStart=null; S.coach=null;
    track("Coach Mark Closed",{area:a, method:"interrupted", duration_ms:leave-(sv.coachStart||leave)}); }
  S.gaps.push([leave,back]); S.resumed=true;
  S.pop=null; S.preview=false; S.settings=false; S.endAsk=false; S.toast=false; S.loading=false; S.detail=null;
  if(S.card<=7 && (S.done[S.card]||S.gaveUp[S.card])){ S.card=curMission()-1; if(S.card>7) S.allDone=true; }
  S.progT=null; S.progKey="";
  track("Session Resumed",{gap_ms:back-leave, resume_count:S.gaps.length});
}

/* ---------- 검색: 관련도 ---------- */
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const norm=s=>String(s).toLowerCase().replace(/\s+/g,"");
const cho=s=>[...s].map(c=>{const k=c.charCodeAt(0)-0xAC00; return k>=0&&k<11172?CHO[Math.floor(k/588)]:c;}).join("");
function scoreTok(f,q){
  const n=norm(f.n), kws=f.kw.split(" ").map(norm), cr=norm(f.cr.join(""));
  if(/^[ㄱ-ㅎ]+$/.test(q)) return cho(n).startsWith(q)?70:cho(n).includes(q)?45:kws.some(k=>cho(k).startsWith(q))?30:0;
  if(n===q) return 100; if(n.startsWith(q)) return 85; if(n.includes(q)) return 70;
  if(kws.some(k=>k===q)) return 60; if(kws.some(k=>k.startsWith(q))) return 50; if(kws.some(k=>k.includes(q)||q.includes(k)&&k.length>=2)) return 40;
  if(cr.includes(q)) return 20; return 0;
}
function csSearch(raw){
  const toks=raw.trim().split(/\s+/).map(norm).filter(Boolean); if(!toks.length) return null;
  let res=FEATS.map((f,i)=>{ let s=0, ok=true; for(const t of toks){ const v=scoreTok(f,t); if(!v){ ok=false; break; } s+=v; }
      // 한글 단계별 매칭(갑·가바·ㄱㅂ 등 입력 도중의 검색어)도 결과에 포함
      const m=acMatch(f.n,raw); const am=m?[90,75,50][m.tier]*toks.length:0;
      if(!ok&&!am) return null; return {f,s:Math.max(ok?s:0,am),i}; }).filter(Boolean);
  // 위치 순으로 늘어놓기 전에, 검색어와 약하게만 걸린 결과는 뺌
  const whole=norm(raw);
  if(toks.length>1){ const hit=res.filter(x=>norm(x.f.n).includes(whole)||norm(x.f.kw).includes(whole)||norm(x.f.cr.join("")).includes(whole)); if(hit.length) res=hit; }
  const top=Math.max(0,...res.map(x=>x.s)); res=res.filter(x=>x.s>=top*0.5);
  return res.sort((a,b)=>catRank(a.f)-catRank(b.f)||a.f.cr.length-b.f.cr.length||b.s-a.s||a.i-b.i).map(x=>x.f);
}

   같은 영역 안에서는 경로가 짧은(위에 있는) 기능 먼저, 그다음 검색어와 더 잘 맞는 순 */

/* ---------- 검색 모달 (IA: 검색 입력 영역 + 결과 카드 영역) ----------
   처음에는 검색 바만. 검색 버튼 또는 Enter를 누르면 아래에 결과 카드 영역이 열림. */
let CS=null; // {q, done(검색한 검색어), list, on}
function csOpen(method){ if(ARM!=="C") return; /* B'안에는 기능 찾기 검색이 없음 */
  if(S.screen!=="editor"||CS||S.coach) return;
  hideTT&&hideTT(); clearHL();
  CS={q:"",done:null,on:0,list:[]};
  const el=document.createElement("div"); el.id="csearch"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","기능 찾기");
  el.innerHTML=`<div class="cs-bar" role="search">${ic("search")}<input id="csq" placeholder="찾는 기능을 입력하세요 (예: 글자 수, 필수, 순서)" autocomplete="off" aria-label="기능 검색" role="combobox" aria-autocomplete="list" aria-controls="csac"><button class="cs-go" data-csgo>검색</button><kbd data-csx>ESC</kbd><ul class="cs-ac" id="csac" role="listbox" aria-label="추천 검색어" hidden></ul></div><div class="cs-res" id="csres" hidden></div>`;
  document.body.appendChild(el);
  const inp=el.querySelector("#csq");
  inp.addEventListener("input",()=>{ CS.q=inp.value; CS.acOpen=true; CS.si=-1; acDraw(); }); // 조합 중인 글자도 즉시 반영
  inp.addEventListener("focus",()=>{ if(inp.value.trim()&&CS.done!==inp.value.trim()){ CS.acOpen=true; acDraw(); } });
  el.querySelector("[data-csgo]").onclick=()=>csSubmit("button");
  el.addEventListener("mousedown",e=>{ if(!e.target.closest(".cs-bar")&&CS&&CS.acOpen){ CS.acOpen=false; acDraw(); } }); // 입력창 밖을 누르면 추천어 닫기
  el.addEventListener("mousedown",e=>{ if(e.target===el||e.target.closest("[data-csx]")){ e.preventDefault(); csClose("dismiss"); } });
  setTimeout(()=>inp.focus(),0);
  track("Feature Search Opened",{method});
}
function csSubmit(how){
  if(!CS) return; const q=(document.getElementById("csq")?.value||"").trim(); CS.q=q;
  if(!q){ CS.done=null; const box=document.getElementById("csres"); box.hidden=true; box.innerHTML=""; return; }
  CS.done=q; CS.on=0; CS.acOpen=false; acDraw(); csDraw();
  track("Feature Search Submitted",{query:q, result_count:CS.list.length, method:how});
}
function csClose(how){ if(!CS) return; if(how) track("Feature Search Closed",{method:how, query:CS.q, searched:!!CS.done}); CS=null; document.getElementById("csearch")?.remove(); }
function markName(n,q){
  const t=q.trim(); if(!t) return esc(n);
  const toks=t.split(/\s+/).filter(Boolean).sort((a,b)=>b.length-a.length);
  for(const tk of toks){ const i=n.toLowerCase().indexOf(tk.toLowerCase()); if(i>=0) return esc(n.slice(0,i))+"<mark>"+esc(n.slice(i,i+tk.length))+"</mark>"+esc(n.slice(i+tk.length)); }
  return esc(n);
}
function csDraw(){
  const box=document.getElementById("csres"); if(!box||!CS||!CS.done) return;
  const list=csSearch(CS.done)||[];
  CS.list=list; CS.on=Math.min(CS.on,Math.max(0,list.length-1));
  box.hidden=false;
  const groups=[]; list.forEach((f,i)=>{ const g=f.cr[0]; let G=groups[groups.length-1]; if(!G||G.g!==g){ G={g,items:[]}; groups.push(G); } G.items.push([f,i]); });
  box.innerHTML=list.length?`<div class="cs-h">검색 결과 ${list.length}개 · 위치 순</div>${groups.map(G=>`<div class="cs-grp">${esc(G.g)}</div><div class="cs-grid" role="listbox" aria-label="${esc(G.g)}">${G.items.map(([f,i])=>`<button class="cs-card ${i===CS.on?"on":""}" role="option" aria-selected="${i===CS.on}" data-csi="${i}"><span class="art">${artOf(f)}</span><b>${markName(f.n,CS.done)}</b><span class="cr">${f.cr.map(esc).join(" › ")}</span></button>`).join("")}</div>`).join("")}
   <div class="cs-foot"><span>←↑↓→ 이동</span><span>Enter 위치 보기</span><span>Esc 닫기</span></div>`
   :`<p class="cs-empty">‘${esc(CS.done)}’에 맞는 기능이 없어요. 다른 말로 검색해 보세요.</p>`;
  box.innerHTML=`<div class="cs-scroll">${box.innerHTML}</div>`;
  box.querySelectorAll("[data-csi]").forEach(b=>{
    b.onmousemove=()=>{ const i=+b.dataset.csi; if(CS.on!==i){ CS.on=i; box.querySelectorAll(".cs-card").forEach((c,j)=>{c.classList.toggle("on",j===i);c.setAttribute("aria-selected",j===i);}); } };
    b.onclick=()=>csPick(+b.dataset.csi,"click");
  });
}
function csMove(d){
  if(!CS||!CS.done||!CS.list.length) return; CS.on=Math.max(0,Math.min(CS.list.length-1,CS.on+d));
  const box=document.getElementById("csres"); box.querySelectorAll(".cs-card").forEach((c,j)=>{c.classList.toggle("on",j===CS.on);c.setAttribute("aria-selected",j===CS.on);});
  box.querySelector(".cs-card.on")?.scrollIntoView({block:"nearest"});
}
function csPick(i,how){
  if(!CS) return; const f=CS.list[i]; if(!f) return;
  track("Feature Search Selected",{feature:f.id, feature_name:f.n, rank:i+1, query:CS.done, method:how});
  csClose(); goFeature(f);
}

/* ---------- 결과로 이동 ----------
   위치 경로(브레드크럼) 1 › 2 › 3 › 4 를 한 번에 한 곳씩만 강조.
   첫 단계부터 강조하고, 사용자가 그 위치를 실제로 눌러야 다음 위치로 강조가 옮겨 감.
   지나가는 위치(상위) = 명도만 깜빡임 / 찾는 기능(하위) = 그라데이션 테두리 회전.
   단계는 화면 상태(창이 열렸는지, 문항이 선택됐는지 등)로 판단하고, 이미 된 단계는 건너뜀. */
let FLOW=null;
const Q=s=>document.querySelector(s);
const QA=s=>[...document.querySelectorAll(s)];
const gear=()=>Q('[data-el="settings_button"]');
const catItem=k=>Q(`#cat_pop [data-type="${k}"]`)||Q(`#cat_center [data-type="${k}"]`);
const catOpen=()=>!!(Q("#cat_pop")||Q("#cat_center"));
const rightRow=g=>g.ent?Q(`#right [data-ent="${g.ent}"]`)?.closest(".trow"):g.sel?Q(`#right ${g.sel}`):Q(`#right [data-el="toggle_${g.tog}"]`)?.closest(".trow");
const cardOf=id=>Q(`.fcard[data-id="${id}"]`);
const candOf=need=>{ const cur=sel(); return (cur&&need.fn(cur))?cur:[...S.fields].reverse().find(need.fn); };

/* 기능마다 거쳐 가는 단계: el = 강조할 곳, done = 그 단계를 이미 지났는지(화면 상태), leaf = 찾는 기능 */
function stepsOf(f){
  const g=f.go;
  if(f.id==="s_limit") return [
    {el:gear, done:()=>S.settings, dim:true},
    {el:()=>Q(`.settings nav [data-tab="${g.tab}"]`), done:()=>S.settings&&S.setTab===g.tab, dim:false},
    {el:()=>Q(`[data-srow="limit"]`), done:()=>!!(S.sset&&S.sset.limit), dim:false, scroll:1},
    {el:()=>Q(`[data-slimit]`), leaf:1, dim:false, scroll:1}];
  if(g.t==="set") return [
    {el:gear, done:()=>S.settings, dim:true},
    {el:()=>Q(`.settings nav [data-tab="${g.tab}"]`), done:()=>S.settings&&S.setTab===g.tab, dim:false},
    {el:()=>Q(`[data-srow="${g.row}"]`), leaf:1, dim:false, scroll:1}];
  if(g.t==="cat") return [
    {el:()=>Q('[data-el="left_plus"]'), done:catOpen},
    {el:()=>catItem(g.k), leaf:1, scroll:1}];
  if(g.t==="pop"){ const btn=g.kind==="branding"?"branding":"button_custom"; return [
    {el:()=>Q(`[data-el="${btn}"]`), done:()=>!!(S.pop&&S.pop.kind===g.kind)},
    {el:()=>Q(`#cpop [data-prow="${g.row}"]`), leaf:1}]; }
  if(g.t==="pv") return [
    {el:()=>Q('[data-el="preview_button"]'), done:()=>S.preview},
    {el:()=>Q(g.sel), leaf:1, dim:false}];
  if(g.t==="card"||g.t==="hover"){ const need=NEED[g.need||"any"]; return [
    {el:()=>{ const c=candOf(need); return c?cardOf(c.id):null; }, done:()=>{ const s=sel(); return !!(s&&need.fn(s)); }, scroll:1},
    {el:()=>Q(`.fcard.sel ${g.sel}`), leaf:1, reveal:g.t==="hover"?()=>Q(".fcard.sel .addzone")?.classList.add("creveal"):null}]; }
  if(g.t==="kebab"){ const row=()=>Q("#left .fitem.sel")||Q("#left .fitem"); return [
    {el:()=>row()?.querySelector(".kebab"), done:()=>!!(S.pop&&S.pop.kind==="menu"), reveal:()=>row()?.classList.add("creveal")},
    {el:()=>Q(`#fmenu [data-act="${f.id==="dup"?"dup":"del"}"]`), leaf:1}]; }
  if(g.t==="list") return [{el:()=>Q("#left .flist"), leaf:1}];
  return [{el:()=>Q(g.sel), leaf:1}];
}
function goFeature(f){
  const g=f.go; FLOW=null; S.endAsk=false;
  // 찾는 기능과 상관없는 창·팝오버만 닫음 (가는 길은 사용자가 직접 엶)
  if(g.t!=="set"&&S.settings){ S.settings=false; }
  if(g.t!=="pv") S.preview=false;
  if(S.pop&&!((g.t==="pop"&&S.pop.kind===g.kind)||(g.t==="cat"&&S.pop.kind==="catalog")||(g.t==="kebab"&&S.pop.kind==="menu"))) S.pop=null;
  if(g.t==="right"){ FLOW={f,kind:"C"}; track("Feature Guide Started",{feature:f.id}); return render(); }
  const need=g.need&&NEED[g.need];
  if((g.t==="card"||g.t==="hover")&&!candOf(need)){ render(); return showHL(()=>Q('[data-el="left_plus"]'),{style:"blink",note:`${need.lab} 문항을 먼저 추가하면 ‘${f.n}’ 기능을 쓸 수 있어요.`}); }
  if(g.t==="kebab"&&!S.fields.length){ render(); return showHL(()=>Q('[data-el="left_plus"]'),{style:"blink",note:"문항을 먼저 추가하면 각 문항의 ⋮ 메뉴에서 쓸 수 있어요."}); }
  if(g.t==="list"&&S.fields.length<2){ render(); return showHL(()=>Q("#left .flist")||Q('[data-el="left_plus"]'),{style:"ring",note:"문항이 두 개 이상 있으면 목록에서 끌어서 순서를 바꿀 수 있어요."}); }
  FLOW={f,kind:"steps",steps:stepsOf(f)}; track("Feature Guide Started",{feature:f.id,steps:FLOW.steps.length});
  render();
}
function flowTick(){
  if(!FLOW||S.screen!=="editor") return;
  if(FLOW.kind==="C") return cTick();
  const st=FLOW.steps, i=st.findIndex(s=>s.leaf||!s.done()), s=st[i];
  if(FLOW.cur!==i){ FLOW.cur=i; if(s.scroll) setTimeout(()=>s.el()?.scrollIntoView({block:s.dim===false?"center":"nearest",behavior:"smooth"}),s.dim===false?120:0); }
  showHL(s.el,{style:s.leaf?"ring":"blink",dim:s.dim!==false&&!(FLOW.f.go.t==="set"&&S.settings),reveal:s.reveal,pad:s.leaf?3:2,step:true,leaf:!!s.leaf});
}
/* ---------- Type C: 문항 선택·설정형 (단계 툴팁) ----------
   0 문항 추가(+) → 1 문항 유형 → 2 문항 선택 → 3 설정 항목 → 4 세부 입력. 한 번에 한 곳만 강조. */
const C_DESC={length:"응답자가 쓸 수 있는 글자 수를 제한할 수 있어요.",minmax:"응답자가 쓸 수 있는 글자 수를 제한할 수 있어요.",required:"켜면 이 문항에 답해야 설문을 제출할 수 있어요.",
 include:"응답에 꼭 들어가야 하는 단어를 정할 수 있어요.",exclude:"응답에 들어가면 안 되는 단어를 정할 수 있어요.",regex:"정해진 형식(예: 학번, 코드)으로만 답하게 할 수 있어요.",
 count:"고를 수 있는 선택지 개수를 정할 수 있어요.",cinclude:"꼭 골라야 하는 선택지를 정할 수 있어요.",cexclude:"고르면 안 되는 선택지를 정할 수 있어요.",shuffle:"응답자마다 선택지 순서를 섞어서 보여줘요.",
 perlimit:"선택지마다 받을 수 있는 응답 수를 정할 수 있어요.",numrange:"입력할 수 있는 숫자의 범위를 정할 수 있어요.",emailv:"응답자가 이메일 인증을 해야 제출할 수 있어요.",
 dupcol:"같은 열을 여러 행에서 고르지 못하게 해요.",rowshuf:"응답자마다 행 순서를 섞어서 보여줘요.",colshuf:"응답자마다 열 순서를 섞어서 보여줘요.",mobilev:"모바일 화면에서 표를 세로로 보여줘요.",
 phonev:"Enterprise 요금제에서 쓸 수 있어요.",mask:"Enterprise 요금제에서 쓸 수 있어요.",autodel:"Enterprise 요금제에서 쓸 수 있어요.",fileacl:"Enterprise 요금제에서 쓸 수 있어요.",
 ftitle:"결과 화면에서 이 문항을 구분하는 이름이에요.",ftype:"문항을 다른 유형으로 바꿀 수 있어요."};
const REC_DESC={long:"긴 의견을 받는 글 입력 문항이에요.",short:"짧은 답을 받는 글 입력 문항이에요.",choice:"보기 중에서 고르는 문항이에요.",photo:"이미지 중에서 고르는 문항이에요."};
const josa=(w,a,b)=>{ const c=w.charCodeAt(w.length-1)-0xAC00; return (c>=0&&c<11172&&c%28)?a:b; };
function cIdx(){
  const g=FLOW.f.go, need=NEED[g.need], s=sel();
  if(s&&need.fn(s)) return (g.tog==="length"&&s.len&&s.len.on)?4:3;
  if(S.fields.some(need.fn)) return 2;
  if(catOpen()) return 1;
  return 0;
}
function cPlan(){ const g=FLOW.f.go, last=g.tog==="length"?4:3; const a=[]; for(let i=FLOW.first;i<=last;i++){ if(i===2&&FLOW.first<2&&!FLOW.saw2) continue; a.push(i);} return a; }
function cStepView(i){
  const f=FLOW.f, g=f.go, need=NEED[g.need], rec=need.rec, tn=TYPES[rec]?.name||"";
  if(i===0) return {title:"문항 추가", act:"왼쪽의 + 버튼을 눌러 문항을 추가해 주세요.", desc:`‘${f.n}’${josa(f.n,"은","는")} ${need.lab} 문항에서 쓸 수 있어요.`, el:()=>Q('[data-el="left_plus"]'), style:"blink"};
  if(i===1) return {title:"문항 유형 선택", act:`‘${tn}’${josa(tn,"을","를")} 선택해 주세요.`, desc:REC_DESC[rec]||"", el:()=>catItem(rec), style:"blink", scroll:1};
  if(i===2){ const cands=S.fields.filter(need.fn), many=cands.length>1;
    const cards=()=>S.fields.filter(need.fn).map(x=>cardOf(x.id)).filter(Boolean);

let HL=null;
const asArr=v=>Array.isArray(v)?v.filter(Boolean):(v?[v]:[]);

function tipHTML(t){
