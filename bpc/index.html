function showHL(get,opt){
  clearHL(true);
  const style=opt.style||"ring", dim=opt.dim!==false;
  const el=document.createElement("div"); el.id="chl";
  el.innerHTML=`<svg class="dim" aria-hidden="true"><defs><mask id="chlmask" maskUnits="userSpaceOnUse"><rect class="mbg" x="0" y="0" width="100%" height="100%" fill="${dim?"#fff":"#000"}"/><g class="mh"></g></mask></defs><rect x="0" y="0" width="100%" height="100%" fill="rgba(17,24,39,${dim?.42:.3})" mask="url(#chlmask)"/></svg><div class="marks"></div>${style==="ring"?`<div class="glow"></div>`:""}${opt.note?`<div class="note">${esc(opt.note)}</div>`:""}${opt.tip?tipHTML(opt.tip):""}`;
  document.body.appendChild(el);
  el.querySelectorAll("[data-ctip]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const a=b.dataset.ctip;
    if(a==="end"){ track("Feature Guide Ended",{feature:FLOW?.f.id, method:"button"}); endFlow(); }
    else if(FLOW){ FLOW.back=a==="back"?1:0; flowTick(); } });
  HL={el,get,style,pad:opt.pad??4,reveal:opt.reveal||null,raf:0,armed:false,persist:!!opt.persist,step:!!opt.step,leaf:!!opt.leaf};
  const box=(n,x,y,w,h)=>{ n.style.left=x+"px"; n.style.top=y+"px"; n.style.width=w+"px"; n.style.height=h+"px"; };
  const sync=(wrap,cls,n)=>{ if(!wrap) return; while(wrap.children.length<n){ const d=document.createElement("div"); d.className=cls; wrap.appendChild(d);} while(wrap.children.length>n) wrap.lastChild.remove(); };
  const marks=el.querySelector(".marks"), glow=el.querySelector(".glow");
  const cls=style==="ring"?"ring":"blink"+(dim?"":" soft");
  const tick=()=>{ if(!HL) return;
    if(HL.reveal) HL.reveal();
    const es=asArr(HL.get()).filter(e=>e.isConnected);
    if(!es.length||S.coach){ el.style.visibility="hidden"; } else { el.style.visibility="";
      const p=HL.pad, R=12, holes=[];
      sync(marks,cls,es.length); sync(glow,"ring",es.length);
      es.forEach((e,i)=>{ const m=marks.children[i], r=rectOf(e), er=parseFloat(getComputedStyle(e).borderTopLeftRadius)||0;
        let x,y,w,h,rad;
        if(HL.style==="blink"){
          // 지나가는 위치: 요소와 정확히 같은 크기·같은 모서리. 덧씌우는 막 없이 요소 자체의 명도만 천천히 바꿈
          x=Math.round(r.left); y=Math.round(r.top); w=Math.round(r.right)-x; h=Math.round(r.bottom)-y; rad=er;
          m.style.display="none";
        } else {
          // 찾는 기능: 요소 바깥으로 같은 간격만큼 띄우고, 모서리도 요소 곡선 + 간격으로 맞춤
          x=Math.round(r.left-p); y=Math.round(r.top-p); w=Math.round(r.right+p)-x; h=Math.round(r.bottom+p)-y; rad=er+p;
          box(m,x,y,w,h); m.style.borderRadius=rad+"px"; m.style.display="";
          if(glow){ box(glow.children[i],x,y,w,h); glow.children[i].style.borderRadius=rad+"px"; }
        }
        holes.push([x,y,w,h,rad]); });
      // 구멍: 요소와 같은 사각형·같은 모서리. 지나가는 위치는 구멍의 투명도를 천천히 바꿔 밝아졌다 어두워짐
      const mh=el.querySelector("svg .mh");
      if(mh){ while(mh.children.length<holes.length){ const rr=document.createElementNS("http://www.w3.org/2000/svg","rect"); if(HL.style==="blink") rr.setAttribute("class",dim?"hpulse":"hpulse inv"); mh.appendChild(rr); }
        while(mh.children.length>holes.length) mh.lastChild.remove();
        holes.forEach(([x,y,w,h,rad],k)=>{ const rr=mh.children[k], rx=Math.min(rad??R,w/2,h/2);
          rr.setAttribute("x",x); rr.setAttribute("y",y); rr.setAttribute("width",w); rr.setAttribute("height",h); rr.setAttribute("rx",rx); rr.setAttribute("ry",rx);
          rr.setAttribute("fill",dim?"#000":(HL.style==="blink"?"#fff":"#000")); }); }
      const a0=rectOf(es[0]), a={left:a0.left-p,top:a0.top-p,right:a0.right+p,bottom:a0.bottom+p};
      el.querySelectorAll(".ctip,.note").forEach(n=>{ const nw=n.offsetWidth, nh=n.offsetHeight, G=14, M=12; let nx, ny;
        if(a.right+G+nw<=innerWidth-M){ nx=a.right+G; ny=a.top; }
        else if(a.left-G-nw>=M){ nx=a.left-G-nw; ny=a.top; }
        else if(a.bottom+G+nh<=innerHeight-M){ nx=a.left; ny=a.bottom+G; }
        else if(a.top-G-nh>=M){ nx=a.left; ny=a.top-G-nh; }
        else { nx=innerWidth-nw-M; ny=innerHeight-nh-M; }
        nx=Math.max(M,Math.min(innerWidth-nw-M,nx)); ny=Math.max(M,Math.min(innerHeight-nh-M,ny));
        n.style.left=nx+"px"; n.style.top=ny+"px"; });
    }
    HL.raf=requestAnimationFrame(tick); };
  tick();
  setTimeout(()=>{ if(HL) HL.armed=true; },250);
}

/* ---------- 한글 단계별 매칭 자동완성 (es-hangul의 disassemble·getChoseong을 유니코드 계산으로 직접 구현) ---------- */
const HG={
  CHO:"ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ",
  JUNG:["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅗㅏ","ㅗㅐ","ㅗㅣ","ㅛ","ㅜ","ㅜㅓ","ㅜㅔ","ㅜㅣ","ㅠ","ㅡ","ㅡㅣ","ㅣ"],
  JONG:["","ㄱ","ㄲ","ㄱㅅ","ㄴ","ㄴㅈ","ㄴㅎ","ㄷ","ㄹ","ㄹㄱ","ㄹㅁ","ㄹㅂ","ㄹㅅ","ㄹㅌ","ㄹㅍ","ㄹㅎ","ㅁ","ㅂ","ㅂㅅ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"],
  // 겹자모(호환 자모)도 낱자로 풀어서 비교 — 'ㅘ'를 따로 친 경우까지 맞춤
  COMPAT:{"ㄳ":"ㄱㅅ","ㄵ":"ㄴㅈ","ㄶ":"ㄴㅎ","ㄺ":"ㄹㄱ","ㄻ":"ㄹㅁ","ㄼ":"ㄹㅂ","ㄽ":"ㄹㅅ","ㄾ":"ㄹㅌ","ㄿ":"ㄹㅍ","ㅀ":"ㄹㅎ","ㅄ":"ㅂㅅ","ㅘ":"ㅗㅏ","ㅙ":"ㅗㅐ","ㅚ":"ㅗㅣ","ㅝ":"ㅜㅓ","ㅞ":"ㅜㅔ","ㅟ":"ㅜㅣ","ㅢ":"ㅡㅣ"},
  dis1(c){ const k=c.charCodeAt(0)-0xAC00; if(k>=0&&k<11172) return HG.CHO[Math.floor(k/588)]+HG.JUNG[Math.floor(k%588/28)]+HG.JONG[k%28]; return HG.COMPAT[c]||c.toLowerCase(); },
  disassemble(s){ return [...s].map(HG.dis1).join(""); },
  cho1(c){ const k=c.charCodeAt(0)-0xAC00; return (k>=0&&k<11172)?HG.CHO[Math.floor(k/588)]:c.toLowerCase(); },
  getChoseong(s){ return [...s].map(HG.cho1).join(""); },
  isChoseongOnly(s){ return !!s&&/^[ㄱ-ㅎ]+$/.test(s); }
};
/* 후보 단어 한 개와 검색어 비교 → {tier, s, e}  (tier 0 시작 일치 · 1 초성 일치 · 2 중간 포함, s~e = 하이라이트할 글자 범위) */
function acMatch(cand,q){
  const chars=[...cand].map((c,i)=>({c,i})).filter(x=>x.c!==" ");  // 띄어쓰기는 무시하고 비교
  const qs=q.replace(/\s+/g,""); if(!qs) return null;
  const range=(units,from,len)=>{ let pos=0,s=-1,e=-1; for(const u of units){ const a=pos,b=pos+u.n; if(s<0&&b>from) s=u.i; if(a<from+len) e=u.i; pos=b; } return {s,e}; };
  // 1) 자모로 풀어서 앞부분 일치 (ㄱ / 가 / 갑 / 가바 → 가방)
  const units=chars.map(x=>({i:x.i,j:HG.dis1(x.c)})).map(u=>({i:u.i,n:u.j.length,j:u.j}));
  const cd=units.map(u=>u.j).join(""), qd=HG.disassemble(qs);
  if(cd.startsWith(qd)) return {tier:0,...range(units,0,qd.length)};
  // 2) 초성만 입력 (ㄱㅂ → 가방)
  if(HG.isChoseongOnly(qs)){ const cu=chars.map(x=>({i:x.i,n:1})), cc=chars.map(x=>HG.cho1(x.c)).join("");
    if(cc.startsWith(qs)) return {tier:1,...range(cu,0,qs.length)};
    const k=cc.indexOf(qs); if(k>0) return {tier:2,...range(cu,k,qs.length)}; }
  // 3) 중간에 포함
  const k=cd.indexOf(qd); if(k>0) return {tier:2,...range(units,k,qd.length)};
  return null;
}
const AC_WORDS=[...new Set(FEATS.map(f=>f.n))];
function acSuggest(q){
  return AC_WORDS.map(w=>{ const m=acMatch(w,q); return m?{w,...m}:null; }).filter(Boolean)
    .sort((a,b)=>a.tier-b.tier||a.w.replace(/\s/g,"").length-b.w.replace(/\s/g,"").length||a.w.localeCompare(b.w,"ko")).slice(0,8);
}
function acHTML(x){ const cs=[...x.w]; return cs.map((c,i)=>i>=x.s&&i<=x.e?`<b>${esc(c)}</b>`:esc(c)).join("").replace(/<\/b><b>/g,""); }
function acDraw(){
  const box=document.getElementById("csac"); if(!box||!CS) return;
  const v=(document.getElementById("csq")?.value||"");
  if(!v.trim()||!CS.acOpen){ box.hidden=true; box.innerHTML=""; return; }
  CS.sug=acSuggest(v); CS.si=Math.min(CS.si??-1,CS.sug.length-1);
  box.hidden=false;
  box.innerHTML=CS.sug.length?CS.sug.map((x,i)=>`<li role="option" id="csac${i}" aria-selected="${i===CS.si}" class="${i===CS.si?"on":""}" data-aci="${i}">${ic("search")}<span>${acHTML(x)}</span></li>`).join("")
    :`<li class="none" role="option" aria-disabled="true">검색 결과가 없어요</li>`;
  document.getElementById("csq")?.setAttribute("aria-activedescendant",CS.si>=0?`csac${CS.si}`:"");
  box.querySelectorAll("[data-aci]").forEach(li=>{
    li.onmousedown=e=>e.preventDefault(); // 입력창 초점 유지
    li.onmousemove=()=>{ const i=+li.dataset.aci; if(CS.si!==i){ CS.si=i; acDraw(); } };
    li.onclick=()=>acPick(+li.dataset.aci,"click"); });
}
function acPick(i,how){ const x=CS.sug&&CS.sug[i]; if(!x) return; const inp=document.getElementById("csq"); inp.value=x.w; CS.q=x.w; CS.acOpen=false; CS.si=-1; acDraw();

 autodel:"「개인정보 보호법」에 의거하여 파기 대상의 응답을 받는 경우, 선택한 보관 기간이 지나면 해당 문항에서 받은 응답은 응답시트에서 삭제되며, 다시 확인할 수 없습니다.",
 fileacl:{lead:"파일을 비공개로 저장하고, 권한이 있는 사용자만 사유를 기록한 뒤 열람·다운로드할 수 있습니다.",items:[
   "열람·다운로드할 때마다 입력한 사유가 활동 로그에 남습니다.",
   "엔터프라이즈 플랜 전용이며, 게시한 뒤에는 해제할 수 없습니다.",
   "응답 시트와 내보내기에는 원본 링크 대신 보안 다운로드 링크로 표시됩니다.",
   "파일 일괄 다운로드에서는 제외됩니다.",
   "토글을 켜기 전에 받은 기존 응답의 파일도 잠시 후 자동으로 보호됩니다."]}
};
function tipIco(k){ return RTIPS[k]?`<span class="itip" tabindex="0" role="img" aria-label="${esc(RTIPS[k].lead||RTIPS[k])}" data-tipk="${k}">${ic("info")}</span>`:ic("info"); }
let rtipEl=null;
function hideRtip(){ rtipEl&&rtipEl.remove(); rtipEl=null; }
function showRtip(icon){
  hideRtip(); const t=RTIPS[icon.dataset.tipk]; if(!t) return;
  rtipEl=document.createElement("div"); rtipEl.className="rtip"+(t.items?" wide":""); rtipEl.setAttribute("role","tooltip");
  rtipEl.innerHTML=t.items?`<p>${esc(t.lead)}</p><ul>${t.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:esc(t);
  document.body.appendChild(rtipEl);
  // 아이콘 위쪽에 띄움 (자리가 없으면 아래), 화면 밖으로 나가지 않게
  const r=icon.getBoundingClientRect(), w=rtipEl.offsetWidth, h=rtipEl.offsetHeight, M=8;
  let x=r.left+r.width/2-w*0.45; x=Math.max(M,Math.min(innerWidth-w-M,x));
  let y=r.top-h-8; if(y<M) y=r.bottom+8;
  rtipEl.style.left=x+"px"; rtipEl.style.top=y+"px";
}
document.addEventListener("mouseover",e=>{ const i=e.target.closest?.(".itip"); if(i&&!S.coach) showRtip(i); });
document.addEventListener("mouseout",e=>{ const i=e.target.closest?.(".itip"); if(i&&!i.contains(e.relatedTarget)) hideRtip(); });
document.addEventListener("focusin",e=>{ const i=e.target.closest?.(".itip"); if(i) showRtip(i); });
document.addEventListener("focusout",e=>{ if(e.target.closest?.(".itip")) hideRtip(); });
document.addEventListener("scroll",hideRtip,true);
{ const _r=render; render=function(){ hideRtip(); _r(); }; }

/* ---------- 문항 카드 본문 2: 객관식(다중)·드롭다운·선형배율·객관식 표·순위 선택·숫자·이메일·주소·설명·임베딩 (실제 왈라 화면 기준) ---------- */
{ const _nf=newField; newField=function(t){ const f=_nf(t); if(t==="rank") f.opts=["","",""]; return f; }; }
{ const _card=cardHTML;
  const SV=(p,cls="")=>`<svg class="i ${cls}" viewBox="0 0 24 24">${p}</svg>`;
  const I_CHECK=SV('<circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.7 2.7L16 9.6"/>',"ock");
  const I_MINUS=SV('<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',"ock");
  const I_LINK=SV('<path d="M9 17H7a5 5 0 0 1 0-10h2"/><path d="M15 7h2a5 5 0 0 1 4.6 3"/><path d="M8 12h7"/><path d="M17 15l3 3-3 3" /><path d="M14 18h6"/>');
  const head=f=>`${f.required?'<div class="req">* 필수입력</div>':""}<input class="qinput" placeholder="질문을 입력하세요..." value="${esc(f.q)}" data-q="${f.id}" data-el="question_input">`;
  const addRow=(f,other=true)=>`<div class="addopt"><button data-el="add_option" data-addopt="${f.id}">${ic("plus")}옵션 추가</button>${other?`<button data-el="add_other">Tт '기타' 옵션 추가</button>`:""}<button class="more" data-el="field_more">${ic("dotsh")}</button></div>`;
  const rows=(f,mark)=>f.opts.map(()=>`<div class="optrow"><div class="box ph">옵션을 입력해주세요${mark}</div><span class="x">${ic("x")}</span></div>`).join("");
  const grid=(mark)=>`<div class="ctable"><div class="ctgrid"><span></span><span class="th">열1</span><span class="th">열2</span><span class="th">열3</span></div><span class="ctaddcol tall" aria-label="열 추가">${ic("plus")}</span></div>`;
  cardHTML=function(f,i){
    let body;
    switch(f.type){
      case "multi": body=rows(f,I_CHECK)+addRow(f); break;
      case "rank": body=rows(f,I_MINUS)+addRow(f)+`<div class="crank"><span>순위 개수</span><span class="cnum"><b>${Math.min(3,f.opts.length)}</b><span>개</span></span></div>`; break;
      case "dropdown": case "dropdown_m": body=`<div class="csel">옵션을 선택해주세요${ic("chev")}</div><div class="addopt"><button data-el="edit_options">${ic("pencil")}옵션 수정</button><button class="more" data-el="field_more">${ic("dotsh")}</button></div>`; break;
      case "scale": body=`<div class="cscale"><div class="cdd">1${ic("chev")}</div><div class="cdd">5${ic("chev")}</div></div><div class="cchips">${[1,2,3,4,5].map(n=>`<span>${n}</span>`).join("")}</div><div class="cscale"><div class="clab">최소 레이블</div><div class="clab">최대 레이블</div></div>`; break;
      case "matrix": case "matrix_m": { const mk=f.type==="matrix"?'<span class="radio"></span>':I_CHECK;
        body=`<div class="cmx"><div class="cmx-main"><div class="cmx-h"><span></span><span>열1</span><span>열2</span><span>열3</span></div>${["행1","행2"].map(r=>`<div class="cmx-r"><span class="rh">${r}</span><div class="band">${[1,2,3].map(()=>`<span>${mk}</span>`).join("")}</div></div>`).join("")}</div><span class="ctaddcol" aria-label="열 추가">${ic("plus")}</span></div>
          <div class="ctaddrow" aria-label="행 추가">${ic("plus")}</div><div class="addopt" style="justify-content:flex-end"><button class="more" data-el="field_more">${ic("dotsh")}</button></div>`; break; }
      case "number": body=`<div class="box cin">숫자를 입력해주세요${ic("pencil")}</div>`; break;
      case "email": body=`<div class="box cin">이메일을 입력해주세요${ic("pencil")}</div>`; break;
      case "address": body=`<div class="box caddr">${ic("search")}주소 검색</div>`; break;
      case "desc": body=""; break;
      case "embed": body=`<div class="cbtnrow"><span class="clink">${I_LINK}URL 임베딩</span></div>`; break;
      default: return _card(f,i);
    }
    return wrapCard(f,i,head(f)+body);
  };
}

function hintHTML(i){
  const lv=S.hint[i]||0, h=HINTS[i]; if(!h) return "";
  if(lv===0) return `<button class="mhintbtn" data-hint="1" data-el="mission_hint">${ic("info")}힌트 보기</button>`;
  const box=`<div class="mhint"><b>힌트</b>${esc(h.t)}</div>`;
  return box; /* 2차 UT: 힌트는 한 단계, 두 안 같은 문구 */
}
function setHint(i,lv,trigger){
  if(i<0||i>7||(S.hint[i]||0)>=lv) return;
  S.hint[i]=lv; S.hintT[i]=now();
  track("Mission Hint Shown",{mission_no:i+1, level:lv, trigger});
  renderMissionOnly();
}
function csOpenWith(q){
  csOpen("hint"); if(!CS) return;
  const inp=document.getElementById("csq"); if(inp){ inp.value=q; } CS.q=q; csSubmit("hint");
}
/* 기능 찾기 열기·선택을 미션 상태로 기록 */
{ const _o=csOpen; csOpen=function(method){
    const had=!!CS; _o(method); if(!CS||had) return;
    document.body.classList.add("cs-open");
    S.searchUsed=true;
    const m=curMission();
    if((method==="slash"||method==="cmd_k") && m<=8 && !S.firstClickChecked[m-1] && !S.coach){ S.firstClickChecked[m-1]=true; S.firstClickCorrect[m-1]=true; }
    if(!S.csTipShown){ S.csTipShown=true; document.querySelector("#csearch .cs-bar")?.insertAdjacentHTML("afterend",`<p class="cs-tip">${ic("info")}찾는 기능을 입력하고 Enter를 누르면, 그 기능이 있는 곳을 순서대로 알려 드려요</p>`); }
    document.querySelector('[data-el="search_button"]')?.classList.remove("pulse");
    check(); renderMissionOnly(); saveState(); }; }
{ const _p=csPick; csPick=function(i,how){
    const f=CS&&CS.list[i];
    if(f && (isDateQ(CS.done)||isDateQ(f.n)||f.id==="t_date")) S.searchPickedDate=true;
    _p(i,how); check(); renderMissionOnly(); saveState(); }; }
{ const _c=csClose; csClose=function(how){ _c(how); if(!CS) document.body.classList.remove("cs-open"); }; }
/* 설문 설정·버튼 커스텀을 연 적이 있는지, 1번 미션 중 돋보기 강조 */
{ const _r=render; render=function(){
    if(S.screen==="editor"){ if(S.settings) S.settingsSeen=true; if(S.pop&&S.pop.kind==="btncustom") S.btnPopSeen=true; check(); }
    _r();
    const sb=document.querySelector('[data-el="search_button"]');
    if(sb) sb.classList.remove("pulse");
  }; }

document.addEventListener("input",e=>{ if(!e.target.matches?.("[data-slimit]")) return; S.sset.limitN=e.target.value; check(); renderMissionOnly(); saveState(); },true);
document.addEventListener("change",e=>{
  if(e.target.matches?.("[data-slimit]")) track("Survey Setting Changed",{setting_key:"limit_n", value:Number(e.target.value)||null});
  if(e.target.dataset?.pin==="text") track("Design Setting Changed",{setting_key:"text", value_length:(e.target.value||"").trim().length, matches_target:btnTextOk()}); // 입력한 문구 자체는 기록하지 않음
},true);
document.addEventListener("input",e=>{ if(e.target.dataset?.pin==="text"){ renderMissionOnly(); saveState(); } },true);
/* 힌트 버튼 */
document.addEventListener("click",e=>{
  if(S.screen!=="editor") return;
  const hb=e.target.closest?.("#mcard [data-hint]"); if(hb){ setHint(S.card,+hb.dataset.hint,"click"); return; }
  if(e.target.closest?.("#mcard [data-hintgo]")){ const h=HINTS[S.card]; track("Mission Hint Search Clicked",{mission_no:S.card+1, query:h.q}); setTimeout(()=>csOpenWith(h.q),0); }
},true);
/* 진행이 없으면 힌트 자동 단계 상승 (코치마크·검색창·화면 숨김 중에는 멈춤) */
setInterval(()=>{
  if(S.screen!=="editor"||S.loading||S.allDone||S.endAsk) return;
  const c=curMission(); if(c>8) return; const i=c-1; if(S.card!==i) return;
  const t=now();
  const key=CRIT[i].map(([,fn])=>fn(S.fields)?1:0).join("")+"|"+S.fields.length;
  if(key!==S.progKey||!S.progT){ S.progKey=key; S.progT=t; if((S.hint[i]||0)===1) S.hintT[i]=t; return; }
  if(S.coach||CS||document.hidden||S.preview){ S.progT+=1000; if(S.hintT[i]) S.hintT[i]+=1000; return; }
  const lv=S.hint[i]||0;
  if(lv===0 && t-S.progT>=HINT1_MS) setHint(i,1,"auto");
},1000);

/* =========================================================
   2차 UT 피드백(11/8): 코치마크는 예시 화면으로 설명 → 끝나면 빈 화면
   코치마크 동안 미션 카드는 접어 두고, 끝나면 펼침 · 4단계(좌·중앙·우·상단) 한 쪽씩
   ========================================================= */
/* 단계마다 설명을 한 쪽에 모두 보여 줌 → 페이지 표기는 전체 단계 기준 1 / 4 */
delete COACH.center.pages; delete COACH.top.pages;
function demoFields(){
  const u=S.uid;
  const a=newField("choice"); a.id="demo1"; a.q="평소 가장 자주 마시는 음료는 무엇인가요?"; a.title="자주 마시는 음료"; a.opts=["아메리카노","카페라떼","녹차"]; a.required=true;
  const b=newField("long"); b.id="demo2"; b.q="매장 이용 후기를 자유롭게 적어 주세요."; b.title="이용 후기";
  const c=newField("short"); c.id="demo3"; c.q="이름을 입력해 주세요."; c.title="이름";
  S.uid=u;
  return [a,b,c];
}
function demoOn(){
  if(S.demo) return;
  S._demoSaved={fields:S.fields, sel:S.sel, uid:S.uid, mcFold:S.mcFold};
  S.fields=demoFields(); S.sel="demo1"; S.pop=null; S.demo=true; S.mcFold=true;
}
function demoOff(){
  if(!S.demo) return;
  const v=S._demoSaved||{fields:[],sel:null,uid:S.uid};
  S.fields=v.fields; S.sel=v.sel; S.uid=v.uid; S.demo=false; S._demoSaved=null; S.mcFold=false; S.pop=null;
  render();
}
/* 예시 문항으로 미션이 완료되지 않게 */
{ const _c=check; check=function(){ if(S.demo) return; _c(); }; }
/* 예시 화면 중에 저장되면 실제 작업(빈 화면 또는 만들던 문항)으로 저장 */
{ const _s=saveState; saveState=function(){
    if(!S.demo||!S._demoSaved) return _s();
    const f=S.fields, s=S.sel, u=S.uid, m=S.mcFold; S.fields=S._demoSaved.fields; S.sel=S._demoSaved.sel; S.uid=S._demoSaved.uid; S.mcFold=false;
    try{ _s(); } finally { S.fields=f; S.sel=s; S.uid=u; S.mcFold=m; } }; }
/* 튜토리얼 시작: 예시 화면 + 미션 카드 접기 */
{ const _t=startTour; startTour=function(trigger){
    const will=(VARIANT==="B"||VARIANT==="C") && !S.coachOff && COACH_ORDER.some(a=>!S.coachSeen[a]);
    if(will){ demoOn(); render(); }
    _t(trigger);
    if(!S.coach) demoOff(); }; }
{ const _r=replayTutorial; replayTutorial=function(){ demoOn(); render(); _r(); }; }
/* 마지막 코치마크를 닫으면(완료·건너뛰기 모두) 빈 화면으로 돌아오고 미션 카드 펼침 */
{ const _cc=closeCoach; closeCoach=function(m){ _cc(m); if(!S.coach && S.demo) demoOff(); }; }
/* 예시 화면 표시 */
{ const _r=render; render=function(){ _r();
    if(S.screen==="editor" && S.demo){ const cv=document.querySelector("#center .canvas"); if(cv && !cv.querySelector(".demo-badge")) cv.insertAdjacentHTML("afterbegin",`<div class="demo-badge">${ic("info")}예시 화면이에요. 안내가 끝나면 빈 화면에서 시작해요.</div>`); } }; }

checkWidth(); resumeIfAny(); applyArm(); render(); if(S.screen==="editor"&&!S.tourDone) setTimeout(()=>startTour("resume"),300); if(S.screen==="editor") preloadB();
</script>
</body>
</html>
